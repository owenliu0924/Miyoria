# Lyrics worker: finds synced lyrics for a song worker on another machine, workers/lyrics/server.py.
# It imports workers/sing/lyrics.py and reads Core's [llm] from miyoria.toml (docs/OPERATIONS.md).
name = "lyrics"
kind = "worker"
provides = ["lyrics"]
summary = "歌詞服務(給在別台電腦的翻唱 worker 用)"

[install]
runtime = "python"
# sing/lyricsllm.py imports tomllib (3.11).
python = ">=3.11,<3.14"
# Its own small project with what server.py and sing/lyrics.py import (no torch), not the sing
# environment.
project = "."

[run]
command = ["{python}", "server.py"]
cwd = "."
port = 8007
host_env = "HOST"
port_env = "PORT"

[run.health]
http = "/health"
