# 仲裁(Arbiter):她想說話 / 做事的唯一關卡。她自己開的話題(心智迴圈 / 計畫)、唱歌報幕、
# 遊戲實況、追問、打招呼都先到這裡;規則只有這一份(取代舊的 [modules.initiative]、心智迴圈的
# 第二套安靜時段和 chat.start 的次數限制),而且會寫進她的帳本,讓她看得到:「你今天主動開了
# 5 次話題,最近 3 次沒人接;下次可主動在 21:40 之後」。報幕、實況、追問不算她主動開的話題。
# pipeline = "v3" 時,發言權(Floor)也看這裡。有人叫她、回她、等結果和緊急的事一定拿麥;
# 下面的額度只管她自己想說的話,而且只算真的送達的台詞,跑工具、開任務都不會重置
# [modules.arbiter.floor]
# text_presence_mins = 30        # 文字頻道裡這麼久內有人說過話才算有人在場(語音看頻道裡的人)
# max_talk_multiplier = 1.5      # 她的多話程度和情緒最多把額度放大幾倍(上限是你設的)
# feeling_weight = 1.25          # 情緒對額度的權重(情緒的偏移最多 ±0.4,乘上這個再加 1)
# min_feeling_multiplier = 0.5   # 再差的心情也只能把基本句數減到這個比例(不能設成 0,她不會因心情永遠沉默)
# max_feeling_multiplier = 1.25  # 再好的心情也只能放大到這個比例;情緒不動已講句數,也繞不過 max_unanswered
# max_hold_secs = 120            # 一句話遲遲沒有回報,最多占住麥克風這麼久
# [modules.arbiter.floor.budget]
# window_mins = 10               # 額度的計算視窗
# base_lines = 6                 # 視窗內她自己開口的基本句數
# per_human_line = 1             # 視窗內每句人話多給幾句
# unanswered_backoff = 2         # 連續沒人回應,下次間隔乘以這個
# backoff_base_secs = 60         # 第一次沒人回應後的等待
# performing_bonus = 8           # 唱歌、直播玩遊戲時多給幾句
[modules.arbiter]
quiet_start_hour = 1             # 安靜時段(當地時間,含開始、不含結束;相同 = 沒有):她不自己開口,
quiet_end_hour = 7               # 回別人、點的歌、事情的結果不受影響
# utc_offset_minutes = 480       # 她的時區(UTC+8)
# day_start_hour = 4             # 「今天」從幾點開始算
max_per_day = 12                 # 她自己開話題:一天最多幾次(0 = 不限)
# max_per_context_per_day = 4    # 同一個頻道 / 語音 / 私訊一天最多幾次
# max_per_person_per_day = 4     # 同一個人一天最多被她主動找幾次
# min_gap_secs = 60              # 任兩次之間至少隔多久
# gap_text_secs = 600            # 同一個地方兩次之間至少隔多久;沒人接一次就加倍,最多 max_backoff 倍
# gap_voice_secs = 300
# max_backoff = 8
# reply_window_text_secs = 600   # 她說完後這段時間內有人叫她 / 回她,才算有人接
# reply_window_voice_secs = 300
# stale_topic_mins = 45          # 沒人接的話題列給她看多久(這段時間內不再提)
# max_unanswered = 3             # 同一個地方她自己開口幾次都沒有人說話,就先安靜,任何人說話(打字或語音,
#                                # 不必叫她)就恢復。遊戲實況和記憶追問也算;回話、報幕、notice、答應的結果、
#                                # 緊急事件和有人要求的目標不受影響,她自己的動作也照做。0 = 不限
# after_speech_text_secs = 5     # 打招呼和她自己開話題,至少等她講完這麼久
# after_speech_voice_secs = 20
# game_hold_mins = 60            # 遊戲被關掉後,她這麼久內不能自己重開(有人明確叫她開可以;0 = 不鎖)
# disabled_contexts = []         # 這些頻道她不主動說話(discord:<guild>:<channel> 或頻道 id)
# greeting = true                # 朋友當天第一次說話時打招呼
# voice_join = true              # 好感夠的人進她的語音頻道時打招呼
# followup = true                # 之前說好要問的事,對方在的時候提出來
# backoff_decay_hours = 24       # 沒人接的加倍間隔,每隔這麼多小時沒有新的沒人接就忘掉一次加倍
# blocked_mins = 30              # 被拒絕或失敗的能力,這麼久內顯示為暫停
# friend_labels = ["朋友", "好朋友", "好友", "摯友", "親友", "戀人", "家人"]   # 算「朋友以上」的關係稱呼
# voice_join_min_affinity = 30   # 好感到這裡的人進語音才會被打招呼(friend_labels 裡的也算)
