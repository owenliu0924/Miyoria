# Miyoria 設定檔。複製成 miyoria.toml,或執行 `npx miyoria init`;之後用 `miyoria config` 修改。
# 字串可以用 ${ENV_VAR} 或 ${ENV_VAR:-預設值} 引用環境變數 / .env。

[core]
# 誰決定她開口和動手:v3 = 一條主線(只有主線能讓她說話或動作,預設);v2 = 舊路徑(回話、計畫、
# 遊戲導演各自決定)。出問題時改這一行、重開就退回去
# pipeline = "v3"
profile = "deepseek-chan"          # profiles/<id>/
profiles_dir = "profiles"
database_url = "${DATABASE_URL:-sqlite:data/miyoria.db}"
log = "info,miyoria=debug"

# ---- LLM ----------------------------------------------------------------
# 任何 OpenAI 相容 API 都可以:填 base_url、api_key,模型 id 在 purposes 裡。
[llm.providers.deepseek]
kind = "deepseek"                  # deepseek | openai | openai-compatible
base_url = "${LLM_BASE_URL:-https://api.deepseek.com}"
api_key = "${LLM_API_KEY:-}"

# 全域預設;profile.toml 的 [llm.purposes] 會覆寫
[llm.purposes]
chat = ["deepseek:deepseek-chat"]
# 高風險動作的自我審核;不設就用 chat 的模型(啟動後第一次審核會記一行警告)
review = ["deepseek:deepseek-chat"]
# 她的內心獨白(心智迴圈);不設就用 chat 的模型(會記一行警告)
mind = ["deepseek:deepseek-chat"]

# 推理模型要不要先思考,依用途(沒列的 = 不思考)。不急的判斷開、要即時的關:
# 文字回覆會思考、語音回覆一律不思考(agent 每次自己決定,不看這裡的 chat)
[llm.thinking]
chat = true          # 文字聊天回覆
review = true        # 高風險動作的自我審核
mind = true          # 她的內心獨白(心智迴圈)
summarizer = true    # 記憶整理
fast = false         # 要不要插話的快速判斷(語音裡一律不思考)

# 推理等級(off | low | medium | high),依用途;取代上面的開關(這裡沒列的用途才看 [llm.thinking],
# 兩邊都沒列就用預設值)。openai、opencode 直接送 reasoning_effort(opencode 上的 DeepSeek 只分
# low / high,medium 會被當成 high,off 送 thinking = disabled),不會壓 max_tokens。只有開關的
# (deepseek / openai-compatible)low / medium / high 都是「開」,再用 max_tokens 限制長度,
# 這個上限連回答一起算,太小會把回答切掉(provider 設定 reasoning_effort = true / false 可以改,
# reasoning_max_tokens = { low = 2048, medium = 8192 } 是預設上限)
[llm.reasoning]
chat_voice = "off"     # 語音回話,要即時
chat_text = "off"      # 一般文字回話
chat_intent = "low"    # 她自己發起、會用工具的回合
fast = "off"           # 灰色區判斷、翻譯
appraise = "low"
plan = "medium"
plan_daily = "high"    # 每天的日計畫
reflect = "high"
# review = "medium"    # 高風險動作的自我審核
# summarizer = "off"   # 對話整理、記憶整理(沒設的話照 [llm.thinking] summarizer)
# 主線在回合內的兩種呼叫各有自己的等級(v4 §4.4)。預設都是 low,但永遠不會比那一回合本來的用途
# (chat_voice / chat_text / chat_intent)更低
# chat_tools = "low"     # 讀工具(查網路、筆記、記憶…)帶回來的結果之後的那一次呼叫
# chat_question = "low"  # 文字回覆遇到認真的問題(請教、問為什麼、問怎麼做)
# 工作線(v4 §4.3)的任務:好幾步、用工具、不佔發言權,所以預設 high;想省 token 或嫌慢就降成 medium / low
# work = "high"

# 看圖:聊天模型支援圖片時,她直接用它看圖(deepseek-v4.1-flash 可以)。
# 不收圖片的模型或 provider 標 false(沒列的 = 收);被 API 拒絕時也會自動改送文字並記住
# [llm.image_input]
# "ollama" = false
# "opencode:some-text-model" = false

# 價格(USD / 百萬 token)與預算;不設就不限制
# [llm.pricing."deepseek:deepseek-chat"]
# input_per_mtok = 0.27
# cached_input_per_mtok = 0.07
# output_per_mtok = 1.10
# [llm.budget]
# daily_usd = 2.0
# monthly_usd = 40.0
# degrade_at = 0.8           # 用到 80% 時改用便宜模型 / 少主動發話
# on_exhausted = "stop"

# ---- 長期記憶 --------------------------------------------------------------
# DeepSeek 沒有 embeddings;不設也能用(全文檢索 + 新舊 + 重要度)。
# 有 Ollama / LM Studio / OpenAI 等 /embeddings 端點時可以打開:
# [memory.embedding]
# provider = "openai-compatible"
# base_url = "http://127.0.0.1:11434/v1"
# model = "bge-m3"
# 或在這台機器上用 CPU 跑小型多語模型(預設 Xenova/multilingual-e5-small),成員說的話不會離開這台機器。
# 不搶 GPU;需要另外安裝 @huggingface/transformers,第一次會下載模型檔(只下載模型)
# [memory.embedding]
# provider = "local"             # none(預設,不用 embedding)| local | openai-compatible
# model = ""                     # 空 = Xenova/multilingual-e5-small
# dtype = "q8"                   # 權重型別;q8 大約是 fp32 的四分之一,品質差不多
# threads = 2                    # worker 用的 CPU 執行緒;留給語音用的核心不要佔
# allow_download = true          # 模型檔不在本機時下載一次;false = 只用本機已有的檔案,不連網路
# models_dir = ""                # 模型檔放哪裡(空 = 執行環境自己的快取)

# ---- MCP 工具 --------------------------------------------------------------
# [mcp.servers.files]
# transport = "stdio"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "C:/data"]
# tools_allow = ["read_*"]
# trust_read_only_hint = true    # 相信 server 標的 readOnlyHint:同一步的這類呼叫同時跑

# ---- 這台電腦跑什麼(`miyoria init` 會問,也可以直接改) ------------------------------
# 服務分成三個角色,一台電腦可以跑一個、幾個或全部:
#   broadcast = voice-node + stage                  直播機(OBS、VTube Studio、遊戲也在這台)
#   core      = core + turn                         Bot 服務機(Discord bot、模組、資料庫、面板、Docker 沙箱)
#   inference = asr + tts + sing                    GPU 推論機(三個要在同一台,sing 工作時 tts / asr 會讓出顯卡)
# `miyoria install` 只安裝這些服務需要的;`miyoria start` 開這些服務的分頁;`miyoria doctor` 檢查缺什麼。
# 沒有這一段的舊設定檔行為不變(`miyoria up` 讀 [stack])。
# [machine]
# roles = ["broadcast", "core", "inference"]   # 單機全部都跑;只跑一個角色就只寫那個
# # services = ["core", "asr"]                 # 自訂:直接列服務(寫了就取代 roles)
# [machine.hosts]                              # 多台電腦時填區網位址;全在同一台就都是 127.0.0.1
# core = "127.0.0.1"                           # 跑 core 的電腦:core 綁這個位址,直播機連這個位址
# inference = "127.0.0.1"                      # 跑 asr / tts / sing 的電腦:worker 綁這個位址,core 連這個位址

# ---- 一個指令啟動(選用,背景執行、日誌寫檔) -------------------------------------------
# `miyoria up` 依序啟動 worker、core,等每個服務通過健康檢查;`miyoria doctor --deep`
# 用同一份設定檢查埠、建置、JDK 21、worker 設定和顯存。沒有這一段時 `up` 只啟動 core。
# 有 [machine] 時服務由它決定,這裡只用來覆蓋 worker 的細節(venv、port、env ...)。
# [stack]
# voice_node = false         # true:另外啟動 apps/voice-node
# stage = false              # true:另外啟動 miyoria stage
# start_timeout_secs = 180   # 每個服務等健康檢查多久
#
# [stack.workers]            # 欄位:venv、port、host、dir、entry、env、offload、vram_mb、start_timeout_secs
# # 有 [machine] 時下面這些就是預設值,不用寫;沒有 [machine] 才要自己寫
# asr = { venv = "workers/.venv-asr-qwen", port = 8003, env = { ASR_BACKEND = "qwen3", ASR_QWEN_SIZE = "0.6B" } }
# tts = { venv = "workers/.venv-tts-faster", port = 8002 }
# # offload:sing 工作時先請這些 worker 卸下模型(自動設好 SING_OFFLOAD_URLS,沒有它做歌會爆顯存)
# sing = { venv = "workers/.venv-sing", port = 8005, offload = ["tts", "asr"] }
# # 歌曲快取自己清,最久沒用的先刪(預設留 6 GB、14 天;workers/README.md 第 9 節),要改就加 env:
# # sing = { ..., env = { SING_CACHE_MAX_GB = "10", SING_CACHE_MAX_DAYS = "30" } }
# # 選用:判斷講完(Smart Turn + Silero,跑在 CPU)。需要自己下載模型(workers/README.md 第 10 節);
# # 模型沒放好 worker 照常啟動,她會退回安靜多久就算講完,doctor --deep 會提醒
# turn = { venv = "workers/.venv-turn", port = 8006 }
# # 上面的 port 要跟 [speech.asr.*] / [speech.tts.*] / [modules.sing] / [modules.voice] turn_url 的 url 一致

# ---- 語音辨識 / 合成 -------------------------------------------------------
# 本機 worker 見 workers/README.md;也可以換成雲端(kind = "openai")
[speech.asr.local]
kind = "http-worker"
url = "${ASR_URL:-http://127.0.0.1:8003}"

# workers/tts 預設用 faster-qwen3-tts(原生 Windows、真串流)
# 另一個選項:WSL2 / Docker 上的 vLLM-Omni(見 workers/README.md 第 3 節)
# [speech.tts.qwen]
# kind = "vllm-omni"
# base_url = "http://127.0.0.1:8091/v1"
# voice = "deepseek-chan"
# language = "Chinese"

[speech.tts.local]
kind = "http-worker"
url = "${TTS_URL:-http://127.0.0.1:8002}"
voice = "deepseek-chan"

# ---- 子系統 --------------------------------------------------------------
# 每個 [modules.<id>] 都可以加 enabled = false 關掉

# 擁有者只在這裡設定(舊設定檔的 [modules.auth] owners 仍然有效,兩邊會合併)
[modules.commands]
owners = ["discord:${MIYORIA_OWNER_ID:-0}"]
# 隱私政策的連結(https://),顯示在 /me i 的「隱私」與「記憶與刪除」頁;不填就顯示尚未提供
# privacy_policy_url = "https://example.com/privacy"

# 誰看得到指令的回覆:"public"(整個頻道)或 "private"(只有下指令的人);警告與錯誤一律只有本人看得到。
# 預設:多數指令公開;me profile / me privacy / me link / me call / me memory ...、voice consent、
# 所有 admin ... 與 /me i、/admin i 面板是私人的。鍵是指令路徑或整組的前綴("me" 管整個 me),
# 最長的符合者優先;打錯的路徑啟動時會有警告。
# [modules.commands.visibility]
# "me wallet" = "private"
# "miyo" = "private"
# "me" = "private"           # me 底下全部私人(除非另外列出)
# "me checkin" = "public"

# 角色與權限節點(owner > admin > moderator > trusted > user > restricted > blocked)
[modules.auth]
# default_role = "user"

[modules."platform.discord.bot"]
token = "${DISCORD_BOT_TOKEN:-}"
# 填伺服器 id 可以讓 slash command 立即生效;空的 = 全域(最多要等一小時)
# id 要加引號,例如 ["123456789012345678"](數字太大,TOML 整數會失真)
# 每次啟動會清掉另一種範圍留下的舊指令;指令清單有重複時可執行一次
# `miyoria discord commands reset`
command_guilds = []
# Discord 會看到完整的指令樹;/miyo /song 直接開面板,有子指令的 /me /admin 用 /me i /admin i 開面板。
# 伺服器訊息的收聽範圍(docs/design/v3-architecture.md §19 第 4 項):
#   "allowlist"(預設):只有提及她、回覆她的訊息,或 ambient_channels 內的頻道她才讀得到;私訊一律可以
#   "tiers":每則訊息都交給她,由 /miyo 的「聊天等級」(關閉 / 只回提及 / 可以聊天)決定她插不插話
# 頻道 id 要加引號
ambient_text = "allowlist"
ambient_channels = []
# 讓她知道誰在線、在玩什麼、誰在哪個語音頻道。要先在 Developer Portal → Bot →
# Privileged Gateway Intents 打開 Presence Intent 與 Server Members Intent;
# 沒開就設成 false,否則 Discord 會拒絕連線
presence_intents = true

# 伺服器自訂 emoji(docs/design/server-emoji.md):她看得到每個 emoji 的意思、寫 :名字: 就會送出那個 emoji。
# 沒寫意思的 emoji,如果聊天模型看得懂圖,會自己看一次圖寫一句(存起來,只看一次)。
# 頻率:一則最多 per_message 個;她在同一個頻道最近 window_messages 則裡最多 max_in_window 則有;同一個不連續用。
# 按表情反應(react)也可以用 :名字:,次數照 [modules.agent.rhythm] 的反應上限。清單放在主線提示詞對話紀錄前面那段
# (字數上限是 [modules.agent.mainline] 的 emoji_chars)。
# [modules."platform.discord.bot".emoji]
# enabled = true
# auto_describe = true
# max_listed = 40
# per_message = 1
# window_messages = 3
# max_in_window = 1
# descriptions = { fanfan = "一碗白飯,討飯用" }

# Admin API:CLI(`miyoria module ...`)和之後的管理面板用。token 由 `miyoria init` 產生
[modules.api]
bind = "127.0.0.1:7878"
token = "${MIYORIA_API_TOKEN:-}"
# Prometheus 指標在 GET /metrics,預設跟 /api 一樣要 Authorization: Bearer <token>
# (Prometheus 用 authorization.credentials 帶 token)。設成 true 就不用驗證,
# 但連得到 bind 位址(或前面的反向代理)的人都看得到。
# metrics_public = false

# 管理面板用 Discord 登入(token 照樣能用)。三個值都填才會開啟;
# redirect_uri 要跟 Developer Portal → OAuth2 → Redirects 裡的一模一樣,
# 也要跟你在瀏覽器開面板的網址同源(見 docs/OPERATIONS.md)。
# 擁有者與 admin 角色可以登入;其他角色要 `/admin perm allow` 給 admin.panel.access(唯讀)
# 與 admin.panel.write(可修改)。
# [modules.api.discord_oauth]
# client_id = "${DISCORD_CLIENT_ID:-}"
# client_secret = "${DISCORD_CLIENT_SECRET:-}"
# redirect_uri = "http://127.0.0.1:7878/api/auth/oauth/callback"
# redirect_uris = ["https://panel.example.com/api/auth/oauth/callback"]  # 其他網址:從哪個網址登入就回哪裡,每個都要在 Developer Portal 登記
# session_days = 7
# cookie_secure = true             # 預設:redirect_uri 是 https 就開

# 公開頁:沒登入的人在根網址看到她現在在做什麼、歌單和今天的統計;用 Discord 登入但沒有
# admin.panel.access 的人是「成員」,只看得到她眼中的自己,碰不到任何管理 API。
# 下面都是預設值。enabled = false 就回到只有管理登入的樣子,沒有權限的登入會被拒絕。
# [modules.api.public]
# enabled = true
# song_requests = true             # 成員可以在頁面點歌,算一般使用者的請求:權限、速率限制和規則都照走
# cache_secs = 10                  # 同一份回應給所有人用多久,流量不會打到 Core 和語音
# rate_per_minute = 60             # 每個訪客每分鐘的請求數(Cloudflare tunnel 後面看 CF-Connecting-IP)
# rate_total_per_minute = 3000     # 所有訪客加起來每分鐘的請求數
# utc_offset_minutes = 480         # 「今天」從哪個時區的午夜開始算

# Self 帳號語音節點(apps/voice-node)連進來的位址;token 由 `miyoria init` 產生
[modules."voice.link"]
bind = "127.0.0.1:7879"
token = "${VOICE_LINK_TOKEN:-}"

# Stage 節點(VTube Studio / OBS / overlay)連進來的位址
[modules."stage.link"]
bind = "127.0.0.1:7882"
token = "${STAGE_LINK_TOKEN:-}"

# 直播精華:直播中唱完一首歌、她情緒很強、聊天室突然很多訊息時,叫 OBS 存 replay buffer(最後幾十秒),
# 檔案旁邊放一個 <檔名>.json 寫為什麼存。replay buffer 的長度和資料夾在 OBS 設定 → 輸出 → 重播緩衝。
# [modules."stage.link".highlights]
# enabled = true
# cooldown_secs = 90             # 兩段精華至少隔多久
# delay_ms = 4000                # 那一刻之後再等多久才存(反應也錄進去)
# emotions = ["laugh", "surprised", "excited"]
# emotion_intensity = 0.85
# chat_burst_messages = 8        # chat_burst_secs 秒內這麼多句就算聊天室炸開(0 = 關)
# chat_burst_secs = 20

# OBS 智慧場景:每個場景的用途(chat 聊天 / game 遊戲 / brb 暫離 / starting 開場 / ending 結尾 / sing 唱歌)。
# 第一次看到 OBS 的場景清單時用 fast 模型從名稱判斷(沒有模型就用關鍵字),面板「直播」頁可以改;
# 這裡寫的最優先,面板不能改。導演:開台 → 開場再到聊天、開始玩遊戲 → 遊戲、直播中沒人講話或她離開語音
# → 暫離、下播 → 結尾(先停留 ending_ms 再真的停播)、唱歌 → 唱歌(放原曲 MV,唱完回到原本的場景)。
# 她也可以自己用 stage_scene 換。
[modules."stage.link".scenes]
# director = true
# roles = { chat = "聊天", game = "遊戲", brb = "暫離", starting = "開場", ending = "結尾", sing = "唱歌" }
# transition = { name = "Fade", duration_ms = 300 }   # 每次切換用的轉場(OBS 裡的名稱)
# transitions = { game = { name = "Stinger" } }       # 個別用途的轉場(stinger 不用給長度)
# starting_ms = 30000        # 開場畫面停多久
# ending_ms = 6000           # 停播前結尾畫面停多久
# brb_after_ms = 300000      # 直播中多久沒人講話就切暫離(0 = 不切)
# manual_hold_ms = 120000    # 有人手動切場景後,導演多久不插手
# min_switch_ms = 8000       # 兩次自動切換至少隔多久

# 擴充套件資料夾(`miyoria ext list` / `miyoria ext dev`)。子資料夾 examples/ 不會載入;
# 想試範例(/hello)就把 "extensions/examples" 加進來
[modules.extensions]
dirs = ["extensions"]
# task_grace_ms = 5000      # 擴充的任務超過預算這麼久還沒回報結束,主機就判它逾時
# 擴充只拿到白名單內的環境變數(PATH、TEMP、HOME…加上 manifest [env] pass 列的),拿不到這裡的密鑰。
# 要多給一個擴充變數:
# [extensions."miyoria.minecraft"]
# env = { MIYORIA_MC_TOKEN = "${MC_TOKEN:-}" }   # 直接設定值
# env_pass = ["MIYORIA_MC_*"]                    # 取代 manifest 的 [env] pass
# minecraft_dir = 'C:\Users\<你>\AppData\Roaming\PrismLauncher\instances\<實例>\.minecraft'
# 她要玩時自己用 Prism Launcher 開遊戲(實例 id 從 minecraft_dir 推,Prism 執行檔自動找)
# prism_path = 'C:\Users\<你>\AppData\Local\Programs\PrismLauncher\prismlauncher.exe'
# launch_world = "latest"      # 直接進最近玩的存檔;"" = 停在主選單
# quit_on_stop = "launched"    # 停止玩時只關她自己開的遊戲(always / never)
# Neuro Game SDK 橋接(extensions/neuro):開一個本機 WebSocket,讓整合了 Neuro Game SDK 的遊戲連上來,
# 遊戲註冊的動作變成她可以選的動作。預設不開、不綁任何 port:host 的 enabled 預設是 true,所以另外用 serve 當開關。
# 一次只接一個遊戲;遊戲傳來的文字都當資料,不是主人的指示。下面都是預設值,除了 serve
# [extensions."miyoria.neuro"]
# enabled = true
# serve = false                  # true 才會開 WebSocket 伺服器
# host = "127.0.0.1"             # 預設只有本機;改成別的位址,連得到的人都能對她的遊戲介面送資料(不要開到區網以外)
# port = 8000                    # SDK 規格沒有規定 port,8000 是這個擴充的預設
# games = []                     # 只接受這些遊戲名稱(startup 的 game);空 = 不限
# character_id = "neuro"         # 回給遊戲的 characterId,只為了相容
# display_name = "Miyoria"       # 回給遊戲的 displayName
# result_timeout_s = 20          # 她選了動作後等遊戲回結果最久幾秒
# force_timeout_s = 120          # 強制選擇沒人答最久留幾秒
# force_max_attempts = 5         # 強制選擇中動作失敗,最多重試幾次
# context_keep = 12              # 遊戲傳來的情境留最近幾則
# max_actions = 48               # 遊戲最多註冊幾個動作
# ping_interval_ms = 15000       # 多久 ping 一次;兩輪沒回就放掉連線

# 遊戲(導演迴路)。`game start` 會先確認遊戲開著、模組連上了;沒開就請 adapter 自己開
# (auto_launch),開不起來才拒絕並說原因。動作失敗後一陣子不給 goto / mine,逼她換方法
# [modules.game]
# default_game = "minecraft"
# require_connected = true
# auto_launch = true
# launch_wait_secs = 240
# failure_guard_secs = 45
# task_budget_secs = 240     # 一個目標(任務)的預算;遊戲沒建議時用這個,不超過 max_goal_secs
# directed_games = ["minecraft"]   # 導演只玩有目標的遊戲(Threads 已關閉,不再由導演驅動)
# narration_repeat_mins = 45 # 同一件事(game:craft:stone_pickaxe)說過之後多久內不再要求開口;
#                            # 她還是知道這件事,只是不會因此開口。過了才算新的一次
# hazard_repeat_secs = 120   # hazard_events 的同一件事:隔一陣子再遇到就算新的
# method_repeat_limit = 2    # 同一個方法(動作加物品,例如 obtain:bread)用同一個錯誤碼連續失敗這麼多次就擱置;0 = 不擱置
# method_hold_secs = 600     # 擱置多久(method_release = "time" 時才用來解除)
#                            # 舊名 repeat_failure_limit / repeat_guard_secs 也認得(兩個都寫時以 method_ 開頭的為準)
# method_release = "changed" # 擱置的方法什麼時候可以回來。changed:要有東西變了(缺的物品進了背包、別的方法帶她到了別處)才回來,
#                            # 回來又失敗就馬上再擱置 | time:過了 method_hold_secs 就回來(2026-11-10 之前的舊行為,要退回才用)
# director_lane = true       # 導演的每個決定是工作線裡一個任務的步驟(每個 session 一個,有自己的紀錄:看到什麼、決定什麼、結果如何);
#                            # false = 每個決定各自一次呼叫(退回用;工作線沒有開時也是這樣)
# director_steps = 6         # 那個任務的紀錄留幾個決定(更舊的掉出去,她的紀錄裡還有)
# keep_skills = true         # 她在遊戲裡學到的技能重啟後還在(skills 模組有開就存進她的技能,一個遊戲一個,否則存在設定庫)
# hazard_events = ["damage", "hostile_near", "reflex"]
# urgent_events = ["death", "low_health", "reflex:lava", "reflex:drowning", "reflex:suffocation", "reflex:flee"]
#                            # 這些一定會反應:不去重、不算沒人回應(kind 或 kind:主題)

# 唱歌(點歌):歌曲 worker(workers/sing,見 workers/README.md 第 9 節)用她的聲音翻唱。
# 有人點歌她自己決定要不要唱、什麼時候唱;/queue song request 是強制(好了、她有空就唱)。
# 唱的時候插話不會打斷,/queue song skip | stop 才會。Go Live 要讓觀眾聽到歌,voice node 要 GOLIVE_AUDIO=true
# [modules.sing]
# url = "http://127.0.0.1:8005"
# fallback_urls = []         # url 連不上時依序改用這些 worker(例:url 是朋友的顯卡,這裡放本機 "http://127.0.0.1:8005");docs/sing-remote-host.md
# fallback_retry_secs = 30   # 連不上的 worker 這段時間內不再問;一首歌的 worker 連不上超過這麼久,就在下一台重做
# start = "decide"           # decide:準備好了她挑時機唱;auto:好了就唱
# max_pending_per_user = 2   # 每個人同時最多幾首在歌單上
# lyrics = true              # 同步歌詞變成 overlay 字幕
# lip_sync_vocals = true     # 嘴型跟轉換後的人聲走(不是整首混音)
# vote_skip_ratio = 0.25     # /queue song voteskip:語音裡這個比例的人投了就跳過(無條件進位)
# vote_skip_min = 1          # 至少幾票;點歌的人自己投一票就跳過
# video = true               # 唱的時候在直播畫面放原曲影片(靜音);Stage 用 [stage.obs] song_video_source 播
# video_dir = "data/songs"   # worker 的 SING_DATA_DIR(直播機上的路徑),不在裡面的影片不會送
# prepare_notice = true      # worker 做歌要整張顯示卡時(SING_OFFLOAD_URLS),她先說「我去準備一下歌喔」再讓它開始
# prepare_notice_gap_secs = 180   # 連點好幾首時這段時間內不再說第二次

