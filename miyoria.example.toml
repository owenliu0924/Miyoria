[modules.agent.vision]
enabled = true
max_images = 3             # 每回合最多幾張
max_image_bytes = 5000000  # 單張上限
# detail = "auto"          # auto | low | high(low 最便宜)

# 別人傳來的檔案(文字、程式碼、markdown、csv、json、pdf、docx、xlsx、pptx):在沙箱裡開、
# 當資料給她看,見 docs/design/file-attachments.md。要有 tools.file(member 以上預設有)。
# 沙箱沒開或 Docker 不能用時,她只會說現在沒辦法安全地打開檔案,不會在沙箱外處理。
[modules.agent.files]
enabled = true
max_files = 2              # 每回合最多讀幾個檔案

# prompt 編譯器:每一段參考資料有自己的字數上限(超過就留整行、標「還有幾行略過」),
