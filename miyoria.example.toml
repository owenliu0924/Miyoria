# ---- 程式沙箱 ----------------------------------------------------------------

# 她寫的程式在用完即丟、不能連外的 Docker 容器裡執行(需要 Docker Desktop / Docker Engine)。
# 預設關閉,要明確寫 enabled = true 才會啟動;Docker 沒開時模組顯示 degraded,不影響其他功能。
# Docker 可用時她會多出工具 code_run(跑程式)、tool_propose(把寫好的程式提出成工具)與已核准的
# sbx_<name>;前兩個是高風險,她自己審核,有疑慮才私訊你確認。/admin autonomy status 看狀態,
# GET /api/sandbox/tools 看她寫的工具。安全說明見 packages/sandbox/README.md。
# [modules.sandbox]
# enabled = true
# root = "data/sandbox"          # runs/<id>(每次執行)與 profiles/<profile>/tools(她留下的腳本)
# default_timeout_ms = 30000
# max_timeout_ms = 120000
# max_concurrent = 2
# keep_runs = 20                 # 保留最近幾次執行的輸出檔
# result_chars = 3900            # 程式輸出回給她的字數上限(低於 agent 的 max_tool_result_chars,預設 12500);太長的存成工作區檔案,回覆裡寫檔名
# tool_timeout_ms = 8000         # 她寫的工具每次呼叫的時間上限(低於 agent 的 tool_timeout_ms)
# images = { python = "python:3.12-slim", node = "node:24-slim" }  # 可釘 digest:...@sha256:<hash>
# max_queued = 8                 # 排隊等位子的執行最多幾個,更多的被拒絕(busy)
# pull_timeout_ms = 600000       # 拉映像最久多久(拉映像在執行開始計時之前)
# health_ttl_ms = 30000          # docker version 的結果信任多久
# recheck_ms = 60000             # 多久重新檢查 Docker,決定開放或收回這些能力
# docker = "docker"              # Docker CLI 的執行檔(直接執行,不經過 shell)
# user = "auto"                  # 容器的 --user:auto = Linux / macOS 上用主機的 uid:gid(不是 root 時),其他用 65534:65534;永遠不是 root
# max_scripts = 100              # 每個 profile 的工具資料夾留幾個腳本
# max_proposed_tools = 50        # 每個 profile 留幾個提出的工具(待審、已核准和被拒絕的都算)
# limits = { memory_mb = 256, cpus = 1, pids_limit = 128, tmpfs_mb = 64, max_file_size_bytes = 16777216, nofile = 256 }
#                                # tmpfs_mb:/tmp 的大小;max_file_size_bytes:單一檔案寫多大(ulimit fsize);nofile:每個程序開幾個檔
# pool_size = 0                  # 預設 0 = 關;設 1 以上:每種語言先開好幾個等著的容器(每個只跑一次就丟),一般執行不用等容器啟動
# sessions = { max = 3, idle_minutes = 15, lifetime_minutes = 120, disk_mb = 256 }  # 她的工作階段(同名的執行共用 /work)
# 一次執行進出的大小上限(都是位元組)
# [modules.sandbox.caps]
# max_code_bytes = 262144        # 程式最長
# max_stdin_bytes = 1048576      # stdin 最長
# max_files_in = 32              # 一次執行放進去幾個檔案
# max_files_in_bytes = 4194304   # 放進去的檔案合計
# max_output_bytes = 65536       # stdout 和 stderr 各留多少,其餘丟掉並標成截斷
# kill_output_bytes = 8388608    # stdout 加 stderr 超過這麼多就把容器殺掉(output_limit),免得印不停的迴圈吃滿 CPU
# max_files_out = 32             # 一次執行拿回幾個輸出檔
# max_files_out_bytes = 1048576  # 拿回的輸出檔合計
# [modules.sandbox.files]        # 別人傳給她的檔案(需要沙箱 enabled = true 和 Docker)
# enabled = true
# max_bytes = 2500000            # 檔案上限(下載時也會量,不信任平台回報的大小)
# max_chars = 6000               # 抽出的文字她最多拿到幾字(超過截斷並標示)
# timeout_ms = 20000             # 沙箱裡抽取的時間上限
# download_timeout_ms = 8000
# allowed_hosts = ["cdn.discordapp.com", "media.discordapp.net"]   # 只從這些主機、只用 HTTPS 下載
# per_person = 4                 # 每個人在 window_s 秒內最多讓她讀幾個
# global = 12                    # 所有人加起來
# window_s = 600
# cache_entries = 16             # 抽出的結果在記憶體留幾份(依附件 id;從快取讀不算額度)
# 她自己的資料夾(v4 §8.3):檔案和腳本留得住,跨執行、跨 session。放在 <root>/profiles/<profile>/workspace,
# 需要時以可寫入掛在 /workspace。限額管她用工具寫的;程式留在裡面的東西會在執行後檢查,超過的刪掉
# [modules.sandbox.workspace]
# enabled = true
# max_mb = 64                    # 全部檔案加起來(MiB)
# max_files = 500
# max_file_kb = 1024             # 單一檔案(KiB)
# read_chars = 3900              # workspace_read 一次回幾字(其餘用 offset 分段讀;要低於 agent 的 max_tool_result_chars)
# keep_outputs = 20              # 保留幾個輸出檔(太長被截掉的執行,完整輸出存成 outputs/<run id>.txt)
# 網路:預設全關(allow = []),每次執行都是 --network none。列了主機,要求網路的執行才會拿到一個沒有對外路由的
# Docker 網路,唯一的出口是一個 egress proxy 容器,它只放行這些主機的 80 / 443 埠,而且永遠不連私有位址。
# 主機名稱或 *.example.com(沒有 scheme、連接埠、路徑,也不能只寫 *)。要真的跑一次 Docker 才能驗證
# [modules.sandbox.network]
# allow = []                     # 例如 ["pypi.org", "*.pythonhosted.org"]
# proxy_port = 3128              # proxy 在它的容器內聽的埠
# proxy_memory_mb = 128          # proxy 容器的記憶體(MiB)
# 跑程式的次數上限在 [modules.actions.limits."code.run"](預設每天 30 次、冷卻 20 秒)

# 生圖(docs/design/imagegen.md):連 ComfyUI 的 API 生圖,給她的其他系統用(目前沒有指令,成員叫不到)。
