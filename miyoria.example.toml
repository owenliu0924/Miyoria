# batch_hours = "02:00-08:00"     # batch 優先度的工作只在這段時間跑(null 為隨時);interactive 隨時
# pause_while_singing = true      # 唱歌(或準備唱歌)時不送新工作,正在跑的 batch 會中斷、之後重排
