# 遊戲內聊天變成獨立的對話(每個世界 / 伺服器一段歷史)。玩家在 Discord 用 /me link 拿代碼,
# 在遊戲聊天室打 `!link <代碼>` 就跟 Discord 帳號連在一起;沒連的玩家是陌生人。
# 她在遊戲裡的回話很短、不會下指令;直播中又在語音裡時也用語音說(她可以用 game_chat_reply 自己改)
[modules."game.chat"]
# games = ["minecraft"]
# world = "local"            # 這個世界 / 伺服器的名字(對話情境的 scope;頻道模式可用 "minecraft:local")
# username = ""              # 她在遊戲裡的名字(別人提到時才知道是在叫她)
# max_chars = 120            # 她在遊戲聊天室一句最多幾個字
# reply = "auto"             # auto | chat | voice | both

[modules.voice]
consent = "opt-out"        # opt-out:預設收音,可用 /voice consent off 退出;opt-in:同意後才收
barge_in = "selective"     # 有人插話時:selective(只有這回合要回的人 / 叫她名字 / 對她說實質內容才停,其他人只降音量)| stop(任何人都停)| ignore
# barge_in_ms = 600            # 這回合要回的人講多久先暫停她(stop 模式:任何人講多久就停)
# barge_in_duck_ms = 250       # 其他人講多久她就降音量
# barge_in_duck_gain = 0.3     # 降音量時剩多少(0~1)
# barge_in_focus_stop_ms = 3000 # 要回的人一直講到這麼久,不等語音辨識就停
# names = ["她的名字", "暱稱"]    # 叫到這些字就停(profile 的名字模組會自己補上)
# music_gate = true            # 唱歌時只有叫她名字的句子算有人講話
# self_echo_tail_ms = 5000     # 她講完後這段時間內,轉錄跟她說的話重複就當回音
# 判斷講完(workers/turn,見 workers/README.md 第 10 節)。模型沒裝、worker 沒開或答得太慢,都會退回舊行為
# turn_engine = "silence"      # silence:安靜 end_silence_ms 或 voice node 關掉串流就算講完 | smart-turn:Smart Turn 判斷
# turn_url = "http://127.0.0.1:8006"   # end-of-turn worker(Smart Turn 和 Silero 都在這裡)
# turn_stop_ms = 200           # 安靜多久問一次模型
# turn_timeout_ms = 150        # 模型這麼久沒答就當沒問,回到 end_silence_ms
# turn_max_silence_ms = 1500   # 模型說還沒講完時,最多等這麼久
# turn_confirm_ms = 400        # 回合結束後對方再安靜這麼久,她的回覆才開始合成(LLM 先跑)
# turn_gate_max_ms = 2000      # 她的回覆為了這件事最多等這麼久
# turn_early_asr = false       # 模型說還沒講完時先辨識一次,真的講完就省下 ASR 時間;每次停頓多跑一次 ASR
# vad_engine = "energy"        # energy | silero(Silero 在 turn_url 的 worker 跑,連不上就退回 energy)
# vad_silero_threshold = 0.5   # Silero 判定是語音的機率
# ASR 常聽錯的字改回來,在任何人讀到轉錄之前做(聽不到名字就等於沒叫她)。拉丁字母整個字比對、不分大小寫
# asr_aliases = { "咪o" = "Miyo", "meo" = "Miyo", "deep sick" = "DeepSeek" }
# asr_while_paused = false     # 做歌佔顯示卡時仍送 ASR(asr_chain 裡有 CPU 的 worker 才有用)
# clip_dir = "data/voice-clips" # 留下同意收音者的片段,用來比較 ASR、校準 Smart Turn。成員的聲音會落地,預設關閉
# tts_prefetch = 2             # 她說話時先合成後面幾句(0 = 關閉)
# tts_prefetch_ttl_ms = 30000  # 預先合成的句子沒人用,過這麼久就丟掉
# speech_hold_max_ms = 90000   # 唱歌 / 顯示卡借出時她的話最多等這麼久,再久就丟掉
# 說話用另一種語言(例如日文聲線比較好聽):每句先用 LLM(fast)翻譯再送 TTS,字幕和聊天紀錄維持原文
# tts_translate = "Japanese"
# Discord Go Live:voice node 的 ffmpeg 在這裡等 OBS 推流(對應 OBS 的伺服器 + 金鑰)。
# 預設 = OBS 伺服器 rtmp://127.0.0.1:1935/live、金鑰 miyoria。`/voice golive start` 會用它
# (她還不在語音裡時,會先進你所在的語音頻道)。
# golive_source = "rtmp://127.0.0.1:1935/live/miyoria"
# golive_listen = true         # true = voice node 的 ffmpeg 自己當 RTMP 伺服器等 OBS 推流;
#                              # false = OBS 推到 MediaMTX(workers/mediamtx/,佔 :1935),ffmpeg 去那裡拉。
#                              # 網站要看直播畫面就用 false,搭配 [modules.activity] obs_hub = true;
#                              # OBS 的設定不用改,一樣是 rtmp://127.0.0.1:1935/live、金鑰 miyoria
# 墊話(v4 §7.5):有人叫她、而她還沒有任何聲音時,先放一小段預先合成好的她自己的聲音(「嗯?」「欸~」),
# 不然對方會聽到一段沉默。只在她被叫到時;她決定不說話的回合、或第一句寫好時就不放。
# 不是一句台詞(不進她的對話紀錄,也不算 Floor 的額度);連兩次不會是同一個。預設開著,不要就 filler = false
# filler = true
# filler_after_ms = 600          # 回合開始後多久還沒有她的聲音就放墊話(模型寫出第一句通常比這更久)
# filler_lines = { Chinese = ["嗯?", "欸~", "蛤?", "等等"], Japanese = ["ん?", "え~", "え?", "えっと"] }
#                                # 依她被聽到的語言(tts_translate,沒設就 tts_language)挑;沒列的語言就沒有墊話。
#                                # 要短而中性,放在任何回答前面都不奇怪;每個聲線只合成一次,存在 filler_dir
# filler_dir = "data/voice/fillers"   # 合成好的墊話放哪(一個聲線一個資料夾)
# filler_max_ms = 1500           # 合成出來比這更長的墊話不用

# 她的行動閘門:進語音、開台、換場景、玩遊戲、私訊……不論誰要求都要過這裡(紀錄在稽核紀錄)。
# 緊急暫停用 /admin autonomy pause;每個人可以用 /me privacy 拒絕私訊或被主動找
[modules.actions]
# paused = false                 # 一開機就是緊急停止狀態(之後以 /admin autonomy resume 的選擇為準)
# emergency_step_ms = 20000      # 緊急停止每一步最多等多久,逾時就算失敗、接著做下一步
# forbidden = ["message.dm"]     # 完全禁止的能力(也可以 "stream.*")
# dm_strangers = false           # 不私訊不熟的人(熟悉度低於 stranger_familiarity)
# [modules.actions.medium]       # 中風險動作的次數上限(她自己決定或聊天請求時;指令不受限)
# per_day = 30
# per_person_per_day = 8
# cooldown_ms = 20000
# inline_wait_ms = 8000          # 高風險工具(跑程式等)等審核多久;來不及就晚點在後續回合告訴她結果
# [modules.actions.limits."code.run"]
# per_day = 50
# cooldown_ms = 5000

[modules.directive]
# 主人規則(docs/design/v3-architecture.md §9)。規則本身存在資料庫裡,用對話、/miyo、/admin i 或面板管理,
# 這裡只設定主人以外的人能做到什麼程度。關掉這個模組只會少了工具和指令,已經有的規則照樣生效。
# viewer_ttl_mins = 10       # 觀眾的要求只是偏好,維持幾分鐘(不管對方怎麼說)
# moderator_max_mins = 1440  # 管理員的規則最長幾分鐘(超過會縮短;管理員一定要給時效)
# max_viewer_wishes = 5      # 同時最多留幾個觀眾的要求(一人一個)
# refresh_secs = 30          # 多久重讀一次規則;讀不到時她的動作全部擋下(停止類動作除外)
# history_days = 30          # 結束的規則在面板留幾天

# 她在做什麼(ActivityManager):語音、直播、活動(遊戲 / 唱歌)只有這一個主人。她的工具、指令、
# 面板、導演都經過它:重複的要求不會重做、同一件事一次只做一個;工具立刻回「開始了,task …」,
# 做好或失敗(含原因,例如「開台失敗:OBS 沒開」)再通知她。開台 = Go Live + OBS 兩步;離開語音前先關台,
# 等她把話講完才離開。
[modules.activity]
# golive_timeout_ms = 60000      # Go Live 多久沒開始就算失敗
# obs = true                     # 連著直播機時 OBS 是開台的第二步(過閘門);false = 只有 Go Live
# obs_start_delay_ms = 3000      # Go Live 開了之後等多久才按 OBS 開始直播(obs_hub:OBS 開播後等多久才開 Go Live)
# obs_attempts = 3
# obs_hub = false                # true = OBS 推到 MediaMTX(workers/mediamtx/),網站自己看得到,跟 Go Live 脫鉤:
#                                # 開台先開 OBS 再開 Go Live;關台、離開語音、Go Live 斷掉都不會停 OBS。
#                                # 要搭配 [modules.voice] golive_listen = false;OBS 一樣推 rtmp://127.0.0.1:1935/live、金鑰 miyoria
# voice_timeout_ms = 20000       # 進 / 離開語音等確認的時間
# speech_wait_ms = 30000         # 離開語音前最多等她把那一輪話講完多久
# game_timeout_ms = 300000       # 遊戲最多開多久(含啟動器與載入世界)
# failed_hold_ms = 120000        # 失敗的活動(例如遊戲斷線)留著給大家看多久
# restore_grace_ms = 180000      # 重啟後上次沒關的遊戲最多等多久連回來,等不到就當已經關了
# restore_poll_ms = 5000         # 重啟後多久看一次那個遊戲回來了沒
# notice_ttl_ms = 600000         # 通知多久後就不用再告訴她

[modules.agent]
# 文字頻道的聊天等級:off(關閉)| mention-only(只回提及)| quiet(安靜)| normal(一般)| lively(活躍)
# (always = 每則都回,測試用;舊的 ambient = normal)。等級是上限:她在等級之內自己決定要多話,
# 有人請她安靜點她也會自己調。沒設定的頻道用 profile 的 default_channel_mode(預設 quiet)。
# 也可以在 Discord 用 /channel mode 或面板「內心 → 世界」即時切換
# default_mode = "quiet"
# channels = { "<channel id>" = "lively", "discord:<guild id>" = "mention-only" }
# 對話紀錄:最多幾個字進 prompt(舊的先丟)、單則上限;她寫 @名字 會變成真的 tag
# max_prompt_chars = 16000
# max_entry_chars = 2000
# mention_users = true
# 回合:最後一則訊息後等多久才開始回(打字中會延長);回覆會引用叫她的那則訊息;
# 對話整理過後至少留幾則原文
# debounce_ms = 800
# reply_reference = true
# history_after_fold = 25
# 合併後的 talkativeness 下限(她自己明確設成 0 除外;別人在回她剛說的話時一律不擋)
# attention.talk_floor 見下面的 [modules.agent.attention]
# 工具:一個回合最多幾輪工具、單次呼叫的時間上限、工具結果回給她的字數上限(超過就截斷)。
# 網頁(web_read)的 [modules.web] result_chars(預設 12000)不要高過這個
# max_tool_steps = 3
# tool_timeout_ms = 10000
# max_tool_result_chars = 12500  # 預設 12500(一頁網頁 12000 字再加一點審查註記);要限制工具結果的長度就調小

# 她什麼時候回(文字):下面都是預設值
# [modules.agent.attention]
# recent_window = 20             # 防洗版的佔比檢查看最近幾則
# max_share_of_recent = 0.3      # 預設不設,用 profile 的 behavior.max_share_of_recent;要蓋掉它才寫
# keywords = []                  # 讓訊息對她更有意思的話題
# gray_low = 0.3                 # 沒叫她的訊息分數低於這個就不理
# gray_high = 0.6                # 到這個分數就不問模型直接過
# direct_probability = 1.0       # 有人直接叫她時回的機率
# llm_check = true               # 灰色區問 fast 模型
# llm_check_timeout_ms = 8000
# llm_yes_probability = 0.9      # 模型說要回之後真的回的機率
# talk_floor = 0.15

# 語音聊天。也可以用 /voice mode 即時切換。要不要插話 = 她的多話程度(心智迴圈或「活躍點」)
# × 佔比上限;有人還在講話時她不插嘴。舊的 ambient_factor、cooldown_ms、min_cooldown_ms、
# interrupt_scale 已經拿掉(留著也能讀,只會警告);她自己多久開一次口由 [modules.arbiter] 決定
# pipeline = "v3" 的主線:一次呼叫同時決定說什麼和做什麼(v4 §4.1)。prompt 預設沒有 token 上限,各部分各有字數預算。
# 對話紀錄放在快取前綴裡,所以放得長也不貴;超過預算時一次砍到 history_trim 的比例(不是每回合丟一則),
# 這樣紀錄的第一行和快取前綴能留很多回合。下面都是預設值
# [modules.agent.mainline]
# prompt_tokens = 8000           # prompt 的 token 上限(預設不設 = 不限);超過時先丟最舊的對話,最新 history_floor 則一定留
# history_floor = 8
# self_chars = 1600              # 「現在」裡她自己的狀態
# data_chars = 12000             # 參考資料(世界、遊戲、筆記)合計
# history_lines = 200            # 對話紀錄最多幾則
# history_chars = 20000          # 對話紀錄最多幾字
# history_trim = 0.6             # 紀錄超過預算時一次砍到預算的這個比例(0 到 1,不含 0)
# entry_chars = 600              # 單則上限
# memory_lines = 20              # 每回合帶進來的記憶最多幾則(0 = 照 [modules.memory] 的 recall_limit)
# examples_chars = 4000          # 範例對話(0 = 不放);每個 session 輪替一批,同一個 session 內不變,前綴才不會變
# loop_tools = ["web_search", "web_read", "recall", "remember", "check_coins", "keep_note", "drop_note", "code_run", "voice_status", "work_list", "work_steer"]
#                                # 回合內迴圈的工具:結果當場帶回、同一次呼叫鏈接著讀;其他工具(開遊戲、唱歌、
#                                # 開台、進語音、work_start)交給手,結果回來另開回合。輪數上限是 [modules.agent] 的 max_tool_steps
# loop_calls = 4                 # 迴圈每一輪最多跑幾個呼叫;一次回應裡更多的會被拒絕(她會知道)
# loop_round_chars = 16000       # 一輪迴圈的結果加起來最多多少字;超過的結果被截短,不會讓 prompt 一次長四頁
# loop_budget_ms = 30000         # 文字:一個回合裡迴圈工具加起來最多跑多久(這段時間她占著發言權);用完後的呼叫交給手
# voice_loop_budget_ms = 12000   # 語音的同一件事(對方在沉默中等)
# memory_recent_lines = 4        # 檢索除了她回的那句,也看它前面幾句(「好啊」本身什麼都找不到)
# people_chars = 3600            # 在場的人的檔案(放在對話紀錄前面)
# people_refresh_mins = 30       # 檔案只在在場的人變了、或過了這麼久才重寫,中間內容不變,前綴才會留在快取
# life_chars = 800               # 「今天的她」(她做過的事),放在對話紀錄前面
# skills_chars = 800             # 她的技能索引(一個名字加一行)
# notebook_chars = 600           # 筆記本索引
# emoji_chars = 1200             # Discord 伺服器自訂表情和意思的清單(表變了才會變,放在對話紀錄前面)
# just_now_chars = 1200          # 「剛才」她在每個地方做了什麼(放在對話紀錄後面)
# elsewhere_chars = 900          # 她在的其他地方在聊什麼
# trace_chars = 600              # 她的工具帶回來的結果,留幾行在她那句回覆旁邊的紀錄裡(一回合所有呼叫合計)
# trace_result_chars = 160       # 單一個呼叫的結果
# traces = 12                    # 一個對話保留幾個回合的軌跡
# tool_chars = 600               # 工具說明的字數上限(超過在句子處截斷)
# tool_arg_chars = 200           # 單一個參數說明
# recent_lines = 4               # 「最近講過」幾句
# context_entries = 4            # 資料區塊裡不可信的工作脈絡最多幾則
# proposals = 3                  # 最多列幾個提案
# first_token_timeout_ms = 15000 # 模型這麼久沒開始回就算失敗,改說固定的短句
# reasoning_first_token_timeout_ms = 60000   # 推理開著時的同一件事(模型可能先想這麼久)
# fallback_gap_ms = 20000        # 同一個地方固定短句的最短間隔
# commitment_due_secs = 120      # 她說要做但沒說期限時,多久算逾期
# commitment_sweep_ms = 5000     # 多久找一次逾期的承諾
# ms_per_char = 180              # 講一個字要多久(被打斷時推算她講到哪)

# 工作線(v4 §4.3):好幾步、要用工具的事(查資料、寫程式、整理筆記本、改進技能)是一個任務,在背景自己做,
# 不佔發言權;結束時主線收到結論和「做了什麼」,由她決定怎麼告訴人。預設開著,下面都是預設值
# [modules.agent.work]
# enabled = true
# max_running = 1                # 同時跑幾個任務(1 到 4);多的排隊
# max_queued = 4                 # 最多排幾個,更多的啟動被拒絕(她會知道)
# max_steps = 12                 # 一個任務最多呼叫模型幾次
# calls_per_step = 4             # 模型一次最多呼叫幾個工具
# max_minutes = 10               # 一個任務從第一步起最多跑幾分鐘
# max_tokens = 80000             # 一個任務最多花多少 token(prompt 加輸出)
# daily_tokens = 600000          # 所有任務一天(UTC)加起來最多花多少 token,遊戲導演的步驟也算在內;用完就不再啟動
# tool_timeout_ms = 30000        # 單次工具呼叫的時間上限
# tool_result_chars = 12500      # 單一個工具結果在任務紀錄裡的字數(一頁網頁是 12000)
# transcript_chars = 48000       # 任務紀錄所有結果合計;超過時最舊的結果縮成一行,長任務留下結論而不是每一頁
# result_chars = 1200            # 她的結論,主線被告知的字數
# did_lines = 6                  # 「做了什麼」告訴主線幾行
# keep_ended = 20                # 結束的任務留幾個給 work_list 和面板
# initiative = true              # 她自己想做的事(上網看看、寫程式、整理筆記本、改進技能)用任務去做,不是一行呼叫
# initiative_steps = 8           # 她自己開的任務最多呼叫模型幾次
# 任務可以用的工具。永遠不會比任務開始的地方的指令(Directive)過濾後允許的更多,
# 也永遠沒有「對人說話」的工具,不論這裡列什麼
# tools = ["web_search", "web_read", "recall", "code_run", "workspace_list", "workspace_read", "workspace_write",
#          "workspace_run", "workspace_save_script", "skill_list", "skill_read", "skill_write",
#          "notebook_read", "notebook_write"]

# 事後修正:v4 §4.5 的第 2 到 4 步,量測夠了才能退掉的、對她輸出的修補。四個預設都開;關掉一個只是拿掉
# 那一個修正,外層的牆(主人規則、行動閘門、送達帳本、輸出審查、Floor 的限額)不受影響。
# 什麼時候可以關:看面板「評測」頁每個修正被觸發的次數(同一個 turn 指標),觸發數在足夠長的期間內夠低
# 才關,多少次、多長期間見 docs/design/v4-patches.md;那邊沒說可以之前不要關
# [modules.agent.corrections]
# tool_text_reask = true         # 工具被寫成文字而不是呼叫:請她再呼叫一次
# promise_commit = true          # 她說了「我等一下進語音」之類的承諾、或寫成文字的工具之後沒有呼叫:記成承諾,不會憑空消失
# claims = true                  # 說了只有工具才做得到的事、或說事情做好了(關鍵字比對):等動作或結果,沒有就丟掉那句並再問她一次
# leak_screen = true             # 回覆審查:是她推理內容的行在送出前丟掉
# self_talk = true               # 她寫給自己的盤算(「他在問我…,直接回他就好。」)只拿掉那一行,文字不送、語音不念;和 leak_screen 分開
# prohibition_write = true       # 主人直接說「不要玩 <遊戲>」而她沒呼叫 directive_add:回合結束時用說話者的身分替她寫一條 deny

# 節奏:文字頻道裡她怎麼「看一眼」和怎麼分幾則送(v4 §7.2、§7.3)。這一節在 [modules.agent.rhythm]
# (不是 [modules.agent.mainline]),下面都是預設值
# [modules.agent.rhythm]
# looks_per_hour = 6             # normal 等級每個頻道每小時看幾眼(再乘上等級和她的多話程度;每一眼是一次呼叫,走快取前綴;0 = 不看)
# question_secs = 20             # 有個問題掛了這麼久沒人答,值得看一眼
# topic_gap_mins = 15            # 安靜這麼久之後的第一句,是新話題,值得看一眼
# close_affinity = 40            # 她至少這麼喜歡(好感 -100 到 100)的人在說話,值得看一眼
# reactions_per_hour = 20        # 每個頻道每小時最多幾個表情反應(不是台詞,不算 Floor 額度);0 = 不反應
# reaction_gap_ms = 3000         # 同一個頻道兩次反應至少隔多久
# pace_ms_per_char = 40          # 一次回覆分成幾則短訊息時,依下一則的長度隔開並顯示輸入中:每字這麼久
# pace_min_ms = 300              # 但最短
# pace_max_ms = 1800             # 最長
[modules.agent.voice]
default_mode = "normal"    # off | mention-only | normal | always(語音沒有安靜 / 活躍之分)
debounce_ms = 700          # 對方講完後等多久(看他是不是還要繼續講)
text_chat = true           # 她在語音頻道裡時,那個頻道文字區打的字她也用說的回
text_aside = true          # 用說的回時,網址和程式碼改貼到語音頻道的文字區
keep_in_voice = true       # 她在語音時,自己的事(做事的結果、遊戲實況)用說的,不發到文字頻道;回別人的話還是留在原處
direct_debounce_ms = 400   # 有人叫她(名字、她剛講完就問她)時只等這麼久
# turn_debounce_ms = 100   # Smart Turn 判定講完時只等這麼久(turn_engine = "smart-turn" 才會用到)
# voice_first = true       # 雙語語音:先寫 <voice> 那句,寫完馬上送 TTS,中文字幕後補(false = 等中文寫完一起送)
# debounce_from_speech_end = true  # 上面的等待從對方最後一個聲音算起,不是從轉錄送到才算(語音節點的靜音偵測和 ASR 本來就等了約一秒);false = 從轉錄算
# speculate = true         # 有人叫她、等待還沒結束時,回合先開始跑(記憶、prompt、模型),等待結束前不說也不做任何事;對方接著講就丟掉重來(次數在 agent_voice_speculation_total)
# speculate_max_per_min = 4  # 每個語音頻道每分鐘最多丟掉幾次提早開始,超過就照舊等
# warm_context = true      # 語音回合 prompt 中不依賴她回的那句的部分,每個頻道先備好、不用等,背景再更新給下一回合
# warm_contributors = ["notebook", "just_now", "elsewhere"]   # 先備好的段落:最多是上一回合的內容
# warm_max_age_ms = 120000 # 備好的內容超過這麼久就不用
# live_context_ms = 400    # 依她回的那句才有的部分(記憶檢索等)在語音最多等這麼久,逾時就不放(文字等 contributor_timeout_ms)
# 下面是她回話的細節,都是預設值
# max_debounce_ms = 2500   # 一個回合的等待上限(有人還在講會延長,但不超過)
# max_share_of_recent = 0.2  # 沒人叫她時,她佔最近語音紀錄的比例上限
# question_window_ms = 8000  # 她講完後這麼久內有人問問題,算是在問她
# gray_low = 0.15          # 沒叫她的語音低於這個分數就不理(語音沒有文字的線索,比文字低)
