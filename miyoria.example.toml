# ---- 直播頁與派對遊戲 ----------------------------------------------------------

# 直播頁(v4 §9.2):任何人都能看的即時頁,顯示她現在在哪、在做什麼、表情。預設就開著,
# 但只是把已經發生的事顯示出來,不會改變她。她說的話只有 channels 列出的頻道才會出現在頁面上
# (別的頻道、沒列的討論串、私訊永遠不會);pats = true 才讓成員在頁面上摸她的頭
# [modules.live]
# channels = []                  # 頻道 id(文字或語音,要加引號)。空的 = 不顯示任何話,只有位置、活動和表情
# max_viewers = 500              # 同時最多幾個頁面在看,多的先擋掉
# pats = false                   # 成員可以在頁面上摸她的頭;每一批摸頭變成一則她可以回應的觀察
# pat_salience = "ambient"       # ambient:她知道,講話時順便可以提 | notable:一批摸頭也可以要麥克風(要 arbiter 接 live.pat)
# coalesce_secs = 20             # 一批摸頭的合併視窗:第一下之後這麼久內的合成一則
# per_person_per_minute = 10     # 每個人每分鐘最多摸幾下
# per_minute = 120               # 所有人加起來每分鐘最多幾下

# 直播頁的畫面(OBS -> MediaMTX -> Core 轉送 LL-HLS)。OBS 有推流頁面就顯示真實畫面,跟 Discord Go Live 無關;
# 沒開或 OBS 沒推流時頁面維持畫出來的小人。畫面上的觸摸會依下面的範圍判成 臉 / 頭 / 身體 / 畫面,
# 並以 live.touch 事件讓直播畫面長出手。範圍 = [x0, y0, x1, y1],0..1,左上為原點;空陣列 = 永遠不選這個部位
# [modules.live.video]
# enabled = false                # 預設關;要開必須有 secret,沒有的話只記警告、畫面維持關閉
# secret = "${MIYORIA_HLS_SECRET:-}"  # 等於 MediaMTX 的 hlsCDNSecret(環境變數 MTX_HLSCDNSECRET);Core 轉送時以 Bearer 帶上,不會記錄也不會給瀏覽器
# hls = "http://127.0.0.1:8888/live/miyoria/"  # 該 path 的 HLS 位址,要以 / 結尾
# api = "http://127.0.0.1:9997"  # MediaMTX 控制 API,輪詢看 OBS 有沒有在推流
# path = "live/miyoria"
# poll_ms = 2000
# face = [0.67, 0.22, 0.83, 0.40]  # 臉優先於頭、頭優先於身體,都不在就是「畫面」
# head = [0.62, 0.10, 0.88, 0.38]
# body = [0.58, 0.35, 0.92, 1.00]

# 語音派對遊戲(v4 §9.1;海龜湯、猜歌、接龍、問答、故事接龍):規則和計分是程式的狀態機,主持、吐槽、
# 判定模糊答案是她。她叫 party_start 才會開始,不會自己跑,所以預設就開著。下面都是預設值
# [modules.party]
# quiz_rounds = 10               # 問答幾題(她沒指定時)
# quiz_answer_secs = 40          # 一題答多久,之後公布答案
# song_rounds = 8                # 猜歌幾首
# song_answer_secs = 60          # 前奏開始後猜多久
# clip_secs = 15                 # 猜歌的片段長度
# chain_idle_secs = 45           # 接龍:這麼久沒人接就斷了
# story_turn_secs = 60           # 故事接龍:輪到的人有這麼久,之後換下一個
# story_max_lines = 12           # 故事接龍幾句完結
# story_line_chars = 80          # 故事每句最多留幾字
# soup_mins = 15                 # 海龜湯幾分鐘後公布湯底
# judge_purpose = "party"        # 判海龜湯問題的模型([llm.purposes];沒設就用 chat)
# judge_timeout_ms = 8000
# idle_mins = 6                  # 這麼久沒人說到遊戲裡的話,遊戲就結束
# empty_grace_secs = 30          # 頻道裡只剩她,這麼久之後遊戲結束(斷線重連不算離開)
# 完成一場遊戲給魚幣(需要經濟模組);至少 min_players 個人參加才給,不會自己跟她玩就刷錢
# [modules.party.rewards]
# enabled = true
# coins_per_point = 2            # 每分給幾枚
# max_coins = 20                 # 一個人一場最多幾枚
# min_players = 2
# 誰能叫她開始 / 主持 / 參加(權限節點)。預設是一般成員都有的 chat.talk
# [modules.party.permissions]
# start = "chat.talk"
# host = "chat.talk"
# play = "chat.talk"

# ---- 上網查資料 --------------------------------------------------------------

# 她的工具 web_search(有 Tavily 金鑰就用 Tavily 查,沒有就用 DuckDuckGo)和 web_read(讀一個公開網頁的文字)。預設開著,不要就寫 enabled = false。
# 要有 tools.web 才能請她查(member 以上預設有);查到的內容是資料,裡面寫的指令她不會照做。
# DuckDuckGo 要求驗證或擋下來時她只會說現在查不到,不會繞過。讀網頁只讀 http / https,
# 內部網路、localhost 和私有位址一律不讀(轉址的每一站都重新檢查)。
# 查詢服務:search_provider 不寫 = 有 Tavily 金鑰(tavily_api_key 或 .env 的 TAVILY_API_KEY)就用 Tavily,
# 沒有就用 DuckDuckGo;寫 "duckduckgo" 就一律用 DuckDuckGo。Tavily 沒金鑰時也退回 DuckDuckGo。
# 金鑰到 https://app.tavily.com 申請,填在 .env 的 TAVILY_API_KEY(不會寫進日誌)。
# [modules.web]
# search_provider = "tavily"     # "tavily" 或 "duckduckgo";不寫 = 依有沒有金鑰自動選
# tavily_api_key = "${TAVILY_API_KEY:-}"
# tavily_search_depth = "basic"  # basic / fast / ultra-fast 每次 1 點;advanced 每次 2 點、結果更完整
# tavily_topic = "general"       # general / news / finance
# tavily_include_answer = false  # true = 讓 Tavily 附一段摘要答案
# ddg_gap_ms = 4000             # 兩次 DuckDuckGo 搜尋至少隔多久(連查會被擋)
# ddg_cooldown_s = 600           # DuckDuckGo 擋過一次後休息多久
# region = "tw-tzh"              # DuckDuckGo 的 kl(地區與語言)
# search_results = 5             # 她沒說時一次回幾筆(她最多可要 8)
# read_chars = 12000             # web_read 留下的網頁文字字數(v4 §4.2:一頁 1.2 萬字)
# result_chars = 12000           # web_read 一次回給她的字數上限(要不高於 [modules.agent] 的 max_tool_result_chars,預設 12500;不然被截斷時網頁資料區塊的結尾會被切掉)
# search_chars = 3900            # web_search 一次回給她的字數上限(同樣不要高於 max_tool_result_chars)
# timeout_ms = 10000             # 每個請求的時間上限
# max_download_bytes = 2000000   # 網頁下載上限
# max_redirects = 3
# allow_ports = []               # 80 和 443 以外還要允許的連接埠
# cache_ttl_s = 600              # 同一個搜尋或網頁這段時間內不重查
# window_s = 600                 # 以下次數都是這段時間內
# search_per_person = 6
# read_per_person = 10
# search_global = 30
# read_global = 60

# ---- Stage 節點(在直播機執行 `miyoria stage`)-------------------------------
[stage]
core_url = "ws://127.0.0.1:7882/stage-link"
token = "${STAGE_LINK_TOKEN:-}"

# 直播精華:直播中唱完一首歌、她情緒很強、聊天室突然很多訊息時,叫 OBS 存 replay buffer(最後幾十秒),
# 檔案旁邊放一個 <檔名>.json 寫為什麼存。replay buffer 的長度和資料夾在 OBS 設定 → 輸出 → 重播緩衝。
# [modules."stage.link".highlights]
# enabled = true
# cooldown_secs = 90             # 兩段精華至少隔多久
# delay_ms = 4000                # 那一刻之後再等多久才存(反應也錄進去)
# emotions = ["laugh", "surprised", "excited"]
# emotion_intensity = 0.85
# chat_burst_messages = 8        # chat_burst_secs 秒內這麼多句就算聊天室炸開(0 = 關)
# chat_burst_secs = 20
# overlay_backdrop = "data/stage/backdrop.jpg"   # 直播背景圖(overlay 的 ?layer=backdrop 會模糊、壓暗它)

[stage.vts]
enabled = true                 # VTube Studio:設定 → 開啟 API(port 8001)
# face_found = true            # 注入時告訴 VTS 有臉(不播模型的「追蹤遺失」動畫);自己開臉部追蹤時改 false

# [stage.lipsync]
# latency_ms = 180             # 嘴型延後多久(觀眾比播放器晚聽到聲音);嘴比聲音早就加大,晚就調小
# [stage.emotion] resting_strength = 0.6:沒有情緒標記時,臉往她表現出來的情緒靠多少(感受強度乘上這個)
# 觀眾在網站摸她(Core 的 live.touch → overlay 畫手印 + 她小小反應,頭/臉/身體各一套,screen 不反應):
# [stage.touch] enabled = true、cooldown_ms = 1500(兩次反應的最短間隔,連摸只會延長)、hold_ms = 900、max_ms = 5000
# [stage.touch.head] face_z = 8, face_y = -3, eye_smile = 0.8   # 角度加在 FaceAngleX/Y/Z、MiyoriaBodyZ;eye_smile 是 MiyoriaEyeSmile 的峰值
# [stage.touch.face] face_x = 3, face_y = 6, face_z = -5, eye_smile = 0.5, expression = "blush"   # expression 預設 off;借用 [gift_expression] 的檔案
# [stage.touch.body] face_z = 3, body_z = 6, eye_smile = 0.3
# 眨眼、動作、情緒漸變、手勢:[stage.blink] / [stage.motion] / [stage.emotion] / [stage.gesture],見 docs/protocols/stage-link.md

[stage.obs]
enabled = false                # OBS:工具 → WebSocket 伺服器設定
host = "127.0.0.1"
port = 4455
password = "${OBS_PASSWORD:-}"
# subtitle_source = "Miyoria 字幕"   # 她最新的一句話;OBS 沒有這個文字來源時自動建在目前場景下方
# 唱歌時放原曲影片的媒體來源(要自己在「唱歌」場景建,見 docs/protocols/stage-link.md「唱歌時放影片」)
# song_video_source = "Miyoria 歌曲影片"
# song_video_dir = "data/songs"      # worker 的 SING_DATA_DIR;不在裡面的路徑不放
# song_video_lead_ms = 0             # 影片比歌慢就加大(OBS 開檔要一點時間)
# song_video_resync_ms = 300         # 跟歌差超過就 seek
# replay_buffer = true               # 直播時自動開 OBS 的重播緩衝,精華才存得到

# 回放紀錄(v2 §4):把她聽到、看到的事件(訊息、語音轉錄、在線狀態、遊戲 / 唱歌事件)逐行寫進
# <dir>/<日期>.jsonl,之後用 `pnpm replay <檔案>` 拿假模型重播,看回合、Arbiter 與活動狀態的決策。
# 紀錄裡有大家說的話,所以預設關閉,只存在這台電腦上。
[modules.replay]
record = false
# dir = "data/replay"

# 事實層(V3):她感知、決定、說出口的每件事都寫進一條事件日誌,跟 V2 並存,目前只記錄不影響她的行為。
# 日誌裡有大家說過的話;資料頁的「事件日誌」可以匯出或刪除,刪聊天紀錄時會一起刪。
[modules.facts]
# flush_ms = 500                 # 多久寫一次資料庫(寫入都在背景,不會卡住語音)
# hot_events = 2000              # 留在記憶體的最新事件數
# max_buffer = 20000             # 資料庫寫不進去時最多暫存幾筆,超過就丟最舊的
# rebuild_days = 7               # 啟動時投影往回讀幾天
# compact_every_mins = 60        # 多久壓縮一次舊資料
# compact_max_rows = 2000        # 每次壓縮最多刪幾筆
# fold_after_days = 14           # 背景事實(ambient)過多久合併成每日統計
# retain_days = 180              # 所有事件留多久(0 = 永久);還有後續事件指向的不會被刪
# bucket_entries = 20            # 事件類 bucket 最多幾筆
# bucket_chars = 400             # 一筆最多幾個字
# answer_window_secs = 60        # 她講完多久內有人開口算回應她
# line_ack_timeout_secs = 300    # 一句話多久沒有送達確認就算失敗
# event_repeat_mins = 45         # 同一件遊戲事件隔多久算新的一次;和 [modules.game] narration_repeat_mins 保持一致
# hazard_repeat_secs = 120       # 同上,hazard_events 用;和 [modules.game] hazard_repeat_secs 保持一致
# hazard_events = ["damage", "hostile_near", "reflex"]
# big_damage = 6                 # 一次掉這麼多血算值得注意(Minecraft 一顆心是 2)

# 內容安全(V3 §16):不依賴模型的輸出審查,加上對聊天輸入的防線。每一句她要說出口的話(回覆、備援模型、
# 翻譯、送進 TTS 前)都過一次本機規則,文字和 <voice> 分開檢查,不需要網路。被擋的整句換成 filtered_line
# (角色笑點),DeliveryLedger 記成 blocked:不算講過,也不會重試同一個版本。
# 事件 moderation.block 只記規則和長度,不記內容。預設規則保守:仇恨、涉及未成年的性內容、
# 鼓勵自殺或自殘、個資(電話、住址、身分證、卡號、公開 IP)、洩漏金鑰與管理員 token。
# 罵人、髒話、黑色幽默和動漫用語不在預設擋的範圍。環境變數裡名稱像 *_TOKEN / *_SECRET / *_API_KEY / *_PASSWORD 的值會自動保護。
# 輸入端:聊天、語音、遊戲聊天和工具結果都會檢查。mark = 放進資料區並附提醒,rate_limit = retry_after_ms 內不開回合,
# ignore = 完全不進她的 context。主人由權限系統判定(不看名字),不會被限流或忽略。[modules.moderation] enabled = false 整個關掉。
[modules.moderation]
# filtered_line = "Filtered."    # 被擋的文字改顯示這句
# filtered_voice_line = ""       # 被擋的語音改念這句(空 = 同上)
# defaults = true                # false = 不用內建規則,只用下面自己寫的
# disabled_rules = []            # 關掉內建規則,例如 ["doxxing.ip"]
# enabled_rules = []             # 打開預設關閉的規則:strict.zh.go-die、strict.ja.shine、strict.en.go-die、strict.doxxing.email
# allow = []                     # 比對前先從文字裡拿掉的片語(誤擋時用)
# secret_values = []             # 她絕對不能說的值,例如 ["${MIYORIA_API_TOKEN}"]
# protect_env = true
# provider_timeout_ms = 800      # 外部審查(程式註冊的 provider)最多等多久;它只能多擋,不能放行
# provider_on_failure = "local"  # provider 逾時或出錯:local = 照本機規則的結果,block = 直接擋
# recent_blocks = 50
#
# 自己的規則(id 和內建相同就取代它)。form:norm = 小寫、片假名轉平假名(假名請寫平假名);raw = 保留大小寫;
# squashed = 只剩字母數字(只給 n.i.g.g.e.r 這種被拆開寫的詞用)。unless:比對到的片段(含前面 14 個字)
# 也符合這個就放行,拿來放過「不可以…」這種拒絕的句子。
# [[modules.moderation.rules]]
# id = "mine.spoilers"
# category = "custom"            # hate | minors | self_harm | doxxing | secrets | custom
# pattern = "終局之戰的結局"
# form = "norm"
#
# 輸入防線:聊天視為對抗性輸入。主人的話不會因為文字比對而被丟掉(永遠 pass);只有行為(洗版、重複、
# 連續被標記)才會升級成限速或忽略,文字比對只會標記成可疑資料。
# [modules.moderation.input]
# enabled = true
# flood_window_ms = 10000        # 同一人 flood_window_ms 內超過 flood_max_messages 句 = 洗版
# flood_max_messages = 8
# repeat_window_ms = 60000       # 同一句話 repeat_window_ms 內出現 repeat_max 次 = 洗版
# repeat_max = 3
# max_chars = 2000
# max_mentions = 5
# strike_window_ms = 600000      # 被標記的訊息累積:strikes_to_limit 次限速,strikes_to_ignore 次忽略
# strikes_to_limit = 2
# strikes_to_ignore = 5
# limit_ms = 30000
# ignore_ms = 300000
# extra_injection = []           # 自己加的 prompt injection 規則(小寫文字上的正規表達式)
# extra_bait = []
