<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>她的房間示意圖</title>
<style>
  /* Tokens from apps/panel/src/index.css (櫻花). One accent is used: the primary. */
  :root {
    color-scheme: dark;
    --background: #0b0d12; --foreground: #f1f0f4; --muted-foreground: #b3b1bc; --soft: #dedce4; --faint: #8f8d99;
    --control: rgba(255,255,255,.1); --control-hover: rgba(255,255,255,.17); --hover: rgba(255,255,255,.08);
    --border: rgba(255,255,255,.11); --line-strong: rgba(255,255,255,.2); --line-soft: rgba(255,255,255,.06);
    --primary: #f29dc4; --primary-foreground: #1f1218;
    --primary-hover: color-mix(in oklab, var(--primary) 72%, white);
    --capsule: rgba(17,18,26,.74); --capsule-fx: blur(16px) saturate(1.25);
    --float: rgba(15,15,21,.9); --float-fx: blur(20px);
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    --top-h: 52px;
    --cap-w: min(720px, calc(100% - 48px));
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { background: var(--background); }
  body {
    margin: 0; overflow: hidden; color: var(--foreground); background: var(--background);
    font: 14px/1.55 "Geist Variable", Geist, "PingFang TC", "Microsoft JhengHei UI", "Noto Sans TC", system-ui, sans-serif;
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  }
  ::selection { background: color-mix(in oklab, var(--primary) 42%, transparent); color: var(--foreground); }
  button, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
  svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75;
    stroke-linecap: round; stroke-linejoin: round; }
  * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.16) transparent; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  [hidden] { display: none !important; }

  /* ---- frame ------------------------------------------------------------------------------ */
  .app { height: 100dvh; display: grid; grid-template-rows: var(--top-h) minmax(0, 1fr); }
  .top { display: flex; align-items: center; gap: 14px; padding: 0 20px; background: var(--background);
    border-bottom: 1px solid var(--border); position: relative; z-index: 40; }
  .top .back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted-foreground);
    text-decoration: none; font-size: 13px; padding: 6px 8px 6px 4px; margin-left: -4px; border-radius: 6px; }
  .top .back:hover { color: var(--foreground); background: var(--hover); }
  .top .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-left: 4px; }
  .top .brand img { width: 20px; height: 20px; display: block; }
  .top .me { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted-foreground); }
  .top .avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--control); color: var(--foreground);
    display: grid; place-items: center; font-size: 12px; font-weight: 600; }
  .top .sep { width: 1px; height: 18px; background: var(--border); }

  /* ---- the stage: she fills it, centred ---------------------------------------------------- */
  .room { position: relative; overflow: hidden; min-height: 0;
    background:
      radial-gradient(60% 55% at 50% 36%, rgba(120,140,210,.08), transparent 72%),
      linear-gradient(180deg, #10131c 0%, var(--background) 100%); }
  .figure { position: absolute; inset: 0; overflow: hidden; }
  .figure video { position: absolute; left: 50%; top: 1%; height: 136%; width: auto; max-width: none;
    transform: translateX(-50%); transition: opacity .32s var(--ease-out), filter .6s var(--ease-out); }
  .figure video.swap { opacity: 0; }
  /* The lower part of the stage dims softly towards the bottom edge; the text band itself gets its
     own scrim from the dock (below), so the words read over her white stockings at any height. */
  .room::after { content: ""; position: absolute; inset: auto 0 0 0; height: 40%; pointer-events: none; z-index: 1;
    background: linear-gradient(180deg, transparent, rgba(11,13,18,.5) 45%, rgba(11,13,18,.8)); }
  body[data-state="asleep"] .figure video { filter: brightness(.34) saturate(.45) blur(.4px); }
  body[data-state="asleep"] .figure { animation: breathe 5.6s ease-in-out infinite; transform-origin: 50% 40%; }
  @keyframes breathe { 50% { transform: translateY(1.5px) scale(1.006); } }

  /* The one status line: top left. */
  .status { position: absolute; z-index: 3; left: 28px; top: 22px; max-width: calc(100% - 140px); margin: 0;
    display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--soft); text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .status svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; }
  .status svg.i { stroke-width: 1.75; stroke-linejoin: round; }
  .status .dot { color: var(--faint); }
  .status a { color: var(--foreground); white-space: nowrap; text-underline-offset: 3px; text-decoration-color: var(--line-strong); }
  .status a:hover { text-decoration-color: var(--primary); }
  .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 11px; flex: none; }
  .eq i { width: 2px; height: 100%; background: var(--primary); border-radius: 1px; transform-origin: 50% 100%;
    animation: eq 1.1s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: -.35s; } .eq i:nth-child(3) { animation-delay: -.7s; }
  @keyframes eq { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }

  /* The bond: a small mark in the top right corner; the reason for a change beside it, for a while. */
  .bond { position: absolute; z-index: 3; right: 20px; top: 14px; display: flex; flex-direction: column; align-items: flex-end; }
  .bond-btn { display: grid; place-items: center; width: 44px; height: 44px; border: 0; background: transparent;
    border-radius: 50%; padding: 4px; transition: background .15s; }
  .bond-btn:hover { background: var(--hover); }
  .ring { width: 36px; height: 36px; display: block; }
  .ring svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .ring .heart { transform-box: fill-box; transform-origin: 50% 55%; }
  .bond.beat .ring .heart { animation: beat .7s var(--ease-out); }
  @keyframes beat { 30% { transform: scale(1.14); } 100% { transform: scale(1); } }
  .bond.dim .ring .heart { animation: dim 1.6s var(--ease-out); }
  @keyframes dim { 25% { opacity: .3; } 100% { opacity: 1; } }
  .delta { display: none; max-width: 240px; margin-top: 2px; font-size: 12px; color: var(--soft); text-align: right;
    text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity 1.2s var(--ease-out); }
  .delta b { font-weight: 600; font-size: 13px; margin-right: 5px; }
  .bond[data-delta] .delta { display: block; animation: rise .5s var(--ease-out) both; }
  .bond.faded .delta { opacity: 0; }
  .bond[data-delta="plus"] .delta b { color: var(--primary); }
  .delta q, .mark q, .said q { quotes: "「" "」"; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } }

  /* ---- the bottom: her line, then the capsule ----------------------------------------------- */
  .dock { position: absolute; z-index: 10; left: 50%; bottom: 28px; transform: translateX(-50%); width: var(--cap-w);
    touch-action: none; user-select: none; -webkit-user-select: none; transition: translate .2s var(--ease-out); }
  .dock textarea { user-select: text; -webkit-user-select: text; }
  /* The text band: full width, fading in over 64 px above the member's line, so that line sits on
     at least .86 of the background and reads at about 6:1 even over the brightest part of her. */
  .dock::before { content: ""; position: absolute; z-index: -1; pointer-events: none; left: calc(50% - 50vw); width: 100vw;
    top: -64px; bottom: -40px; background: linear-gradient(180deg, rgba(11,13,18,0), rgba(11,13,18,.86) 64px, rgba(11,13,18,.9)); }
  .dock.dragging { transition: none; }
  .you-line { margin: 0 0 6px; text-align: center; font-size: 13px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; min-height: 20px; opacity: 0; transition: opacity 1.2s var(--ease-out); text-shadow: 0 1px 2px rgba(0,0,0,.8); }
  .you-line.show { opacity: 1; transition-duration: .2s; }
  .her-line { margin: 0 auto 18px; max-width: 34em; min-height: calc(18px * 1.65); text-align: center; font-size: 18px;
    line-height: 1.65; font-weight: 500; text-wrap: balance; text-shadow: 0 1px 3px rgba(0,0,0,.85); }
  .her-line.more { cursor: pointer; }
  .caret { display: inline-block; width: 2px; height: 1em; margin-left: 2px; vertical-align: -2px;
    background: var(--primary); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .thinking { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 400; color: var(--muted-foreground); }
  .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; transform: scale(.8); } }
  .speaking { margin-left: 8px; vertical-align: 0; }
  .cue { display: none; margin-left: 6px; vertical-align: -3px; color: var(--primary); }
  .her-line.more .cue { display: inline-block; animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(3px); } }

  .handle { display: none; width: 32px; height: 4px; border-radius: 2px; background: var(--line-strong); margin: 0 auto 8px; }
  /* Attachments: small chips above the capsule's start, so the capsule itself never grows. */
  .attach { display: none; flex-wrap: wrap; gap: 6px; margin: 0 0 8px 6px; }
  .attach:not(:empty) { display: flex; }
  .chip { display: inline-flex; align-items: center; gap: 8px; height: 36px; max-width: 260px; padding: 0 3px 0 4px;
    border-radius: 10px; background: var(--capsule); -webkit-backdrop-filter: var(--capsule-fx); backdrop-filter: var(--capsule-fx);
    border: 1px solid var(--border); font-size: 12px; animation: rise .25s var(--ease-out) both; }
  .chip img, .chip .fi { width: 28px; height: 28px; flex: none; border-radius: 6px; object-fit: cover; display: block; }
  .chip .fi { display: grid; place-items: center; background: var(--control); color: var(--soft); }
  .chip .fi svg.i { width: 15px; height: 15px; }
  .chip .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--soft); }
  .chip .sz { flex: none; color: var(--faint); font-variant-numeric: tabular-nums; }
  .chip .x { width: 26px; height: 26px; }
  .chip .x svg.i { width: 14px; height: 14px; }
  .drop { position: absolute; inset: 14px; z-index: 35; display: grid; place-items: center; pointer-events: none;
    border: 1px dashed var(--line-strong); border-radius: 16px; background: rgba(11,13,18,.6);
    animation: rise .2s var(--ease-out) both; }
  .drop span { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--soft); }
  .entry .files { display: block; margin-top: 4px; font-size: 12px; color: var(--muted-foreground); }
  .capsule { display: flex; align-items: center; gap: 2px; height: 52px; padding: 0 6px 0 8px; border-radius: 999px;
    background: var(--capsule); -webkit-backdrop-filter: var(--capsule-fx); backdrop-filter: var(--capsule-fx);
    border: 1px solid var(--border); transition: border-color .15s; }
  .capsule:focus-within { border-color: var(--line-strong); }
  .capsule textarea { flex: 1; min-width: 0; height: 24px; resize: none; border: 0; background: transparent; outline: none;
    padding: 0 8px; line-height: 24px; font-size: 15px; caret-color: var(--primary); overflow: hidden; white-space: nowrap; }
  .capsule textarea::placeholder { color: var(--faint); }
  .listen { display: none; flex: 1; align-items: center; justify-content: flex-start; gap: 10px; padding: 0 8px; font-size: 14px; }
  .listen .eq i { background: var(--foreground); }
  .capsule.listening textarea { display: none; } .capsule.listening .listen { display: flex; }
  .ib { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: 50%; border: 0;
    background: transparent; color: var(--faint); transition: background .15s, color .15s; }
  .ib:hover { background: var(--hover); color: var(--foreground); }
  .capsule.listening .mic { background: var(--foreground); color: var(--background); }
  .voice .off { display: none; } .voice[aria-pressed="false"] .on { display: none; } .voice[aria-pressed="false"] .off { display: block; }
  .send { width: 40px; height: 40px; margin-left: 4px; background: var(--primary); color: var(--primary-foreground); }
  .send:hover { background: var(--primary-hover); color: var(--primary-foreground); }

  /* ---- overlays: the backlog and her words about you ---------------------------------------- */
  .backlog { position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column;
    background: rgba(11,13,18,.86); -webkit-backdrop-filter: blur(6px) saturate(1.1); backdrop-filter: blur(6px) saturate(1.1);
    animation: sheet .3s var(--ease-out); }
  @keyframes sheet { from { transform: translateY(24px); opacity: 0; } }
  .backlog.dragging { animation: none; }
  .bl-head { touch-action: none; flex: none; width: min(720px, 100%); margin: 0 auto; padding: 18px 24px 12px;
    display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
  .bl-head .handle { display: none; }
  .bl-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .bl-head span { font-size: 12px; color: var(--muted-foreground); }
  .bl-head .grow { flex: 1; }
  .tb { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 0; border-radius: 6px;
    background: transparent; color: var(--muted-foreground); font-size: 13px; }
  .tb:hover { background: var(--hover); color: var(--foreground); }
  .bl-list { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  .bl-inner { width: min(720px, 100%); margin: 0 auto; padding: 8px 24px 32px; }
  .entry { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 4px 14px; padding: 12px 0;
    border-bottom: 1px solid var(--line-soft); }
  .entry .who { font-size: 12px; color: var(--muted-foreground); padding-top: 2px; }
  .entry .who time { display: block; font-size: 11px; color: var(--faint); }
  .entry.her .who b { color: var(--foreground); font-weight: 600; }
  .entry .who b { font-weight: 500; }
  .entry p { margin: 0; }
  .entry.her p { font-size: 15px; line-height: 1.7; }
  .entry.you p { font-size: 14px; color: var(--soft); }
  .entry.note p::before { content: "留言 · "; color: var(--muted-foreground); }
  .mark, .sys { padding: 8px 0 8px 70px; font-size: 12px; color: var(--muted-foreground); border-bottom: 1px solid var(--line-soft); }
  .mark b { font-weight: 600; font-size: 13px; margin-right: 6px; color: var(--foreground); }
  .mark.plus b { color: var(--primary); }
  .sys { display: flex; align-items: center; gap: 6px; padding-top: 12px; padding-bottom: 12px; }
  .sys svg.i { width: 14px; height: 14px; }
  .fine { margin: 18px 0 0; font-size: 12px; line-height: 1.6; color: var(--faint); }

  .panel { position: absolute; z-index: 25; right: 16px; top: 104px; width: 360px; max-height: calc(100% - 240px);
    overflow-y: auto; background: var(--float); -webkit-backdrop-filter: var(--float-fx); backdrop-filter: var(--float-fx);
    border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.4); padding: 16px 18px 18px;
    animation: pop .18s var(--ease-out); }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.99); } }
  .panel-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .panel-head .ring { width: 40px; height: 40px; }
  .panel-head .tier b { display: block; font-size: 15px; font-weight: 600; }
  .panel-head .tier span { font-size: 12px; color: var(--muted-foreground); }
  .panel-head .grow { flex: 1; }
  .panel-head .ib { width: 32px; height: 32px; border-radius: 6px; }
  .panel h3 { font-size: 13px; font-weight: 600; margin: 0 0 6px; }
  .said { margin: 0 0 18px; font-size: 14px; line-height: 1.7; }
  .mems { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
  .mems li { border-bottom: 1px solid var(--border); }
  .mem { width: 100%; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; text-align: left;
    background: transparent; border: 0; padding: 9px 0; font-size: 13px; line-height: 1.55; border-radius: 0; }
  .mem .d { color: var(--muted-foreground); }
  .mem .t { color: var(--soft); }
  .mem:hover .t, li.open .mem .t { color: var(--foreground); }
  .mem-more { display: none; padding: 0 0 12px 54px; font-size: 12px; color: var(--muted-foreground); }
  li.open .mem-more { display: block; }
  .mem-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 6px;
    border: 0; background: var(--control); font-size: 12px; transition: background .15s; }
  .btn:hover { background: var(--control-hover); }
  .btn.ghost { background: transparent; color: var(--muted-foreground); }
  .btn.ghost:hover { background: var(--hover); color: var(--foreground); }
  .btn svg.i { width: 14px; height: 14px; }
  .confirm { margin-top: 8px; color: var(--foreground); }
  .confirm p { margin: 0 0 6px; }
  .forgot { font-size: 12px; color: var(--muted-foreground); padding: 9px 0; border-bottom: 1px solid var(--border); }

  /* ---- phones: the capsule spans the width with margins; a handle and a swipe open the backlog -- */
  @media (max-width: 700px) {
    :root { --cap-w: calc(100% - 24px); }
    .top { padding: 0 12px; gap: 10px; }
    .top .back .label, .top .me .name { display: none; }
    .figure video { top: 1%; height: 108%; }
    .status { left: 16px; top: 14px; font-size: 12px; max-width: calc(100% - 84px); flex-wrap: wrap; row-gap: 2px; }
    .bond { right: 8px; top: 4px; }
    .delta { max-width: 52vw; }
    .dock { bottom: calc(12px + env(safe-area-inset-bottom)); }
    .her-line { font-size: 16px; min-height: calc(16px * 1.65); margin-bottom: 12px; }
    .handle { display: block; }
    .log-btn { display: none; }
    .attach { flex-wrap: nowrap; margin-left: 0; }
    .chip { min-width: 0; max-width: calc(50% - 3px); }
    .capsule { height: 50px; }
    .bl-head { padding: 10px 16px 12px; flex-wrap: wrap; }
    .bl-head .handle { display: block; flex: 0 0 32px; margin: 0 calc(50% - 16px) 8px; }
    .bl-inner { padding: 4px 16px 28px; }
    .entry { grid-template-columns: 48px minmax(0, 1fr); gap: 2px 10px; }
    .mark, .sys { padding-left: 58px; }
    .panel { left: 8px; right: 8px; top: 52px; width: auto; max-height: calc(100% - var(--dock-h, 170px) - 70px); }
  }

  /* ---- mock controls: not part of the design ----------------------------------------------- */
  .mock { position: fixed; z-index: 60; top: 12px; left: 50%; transform: translateX(-50%); width: max-content; max-width: 240px;
    background: #f3efe3; color: #1d1b16; border: 1px dashed #6d6656; border-radius: 4px;
    font: 12px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .mock[open] { width: 240px; }
  .mock summary { cursor: pointer; padding: 4px 10px; font-weight: 700; list-style: none; }
  .mock summary::-webkit-details-marker { display: none; }
  .mock .body { padding: 2px 10px 10px; }
  .mock p { margin: 0 0 8px; color: #6d6656; }
  .mock fieldset { border: 0; margin: 0 0 8px; padding: 0; }
  .mock legend { padding: 0; margin-bottom: 3px; font-weight: 700; }
  .mock label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .mock input { accent-color: #1d1b16; margin: 0; }
  .mock button { font: inherit; color: inherit; background: #fff; border: 1px solid #6d6656; border-radius: 3px; padding: 3px 8px; }
  .mock :focus-visible { outline: 2px solid #1d1b16; }
  @media (max-width: 700px) { .mock { left: auto; right: 48px; transform: none; top: 13px; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body data-state="here">

  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6a1.4 1.4 0 0 1-1 .4H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5Z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.4 18.4a9 9 0 0 0 0-12.8"/></symbol>

    status: () => '<span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>在「深夜雜談」唱〈晴天〉' + DOT + '<a href="#">去聽</a>' },

  asleep: { placeholder: "留話給她,醒來會讀", voice: false, mic: false, send: "留給她" },
};
const POSES = { heart: "heart", finger: "finger", sing: "sing", still: "heart" };
const REPLIES = {
  here: [["嗯哼,繼續說,本鯨魚在聽。"], ["這個嘛……讓我深度思考一下。", "好啦其實在想宵夜。你說的我有聽到啦。"]],

};

/* ---- the backlog: both sides, times, and the bond marks where they happened ------------------ */
let entries = [];
/* The mock's own clock, so new lines follow the scene's evening. */
let minute = 52;
function clock() { minute = Math.min(minute + 1, 59); return "23:" + minute; }

}
function logEntry(e) { entries.push(e); if (!$("#backlog").hidden) { $("#entries").appendChild(entryNode(e)); scrollLog(); } }

function openLog() {

  closePanel(false);
  const box = $("#entries"); box.innerHTML = "";

}

/* ---- her words about you and the memories, opened from the ring ------------------------------ */
const MEMS = [
  { d: "11/02", t: "你陪我把〈晴天〉練到能唱完整首", where: "語音 · 深夜雜談", ask: "還記得那天練〈晴天〉嗎?" },
  { d: "10/19", t: "你說你家的貓叫「白飯」,害我笑了一整晚", where: "文字 · 雜談", ask: "白飯最近很胖喔" },
  { d: "09/27", t: "第一次在語音裡聽到你講話,比打字的時候還慢", where: "語音 · 深夜雜談", ask: "我講話真的很慢嗎?" },
];
function memItem(m, i) {

    '</span><span class="t">' + m.t + '</span></button><div class="mem-more" id="mem' + i + '">' + m.where +
    '<div class="mem-actions"><button type="button" class="btn ask">' + icon("i-ask") + "問她這件事</button>" +
    '<button type="button" class="btn ghost forget">' + icon("i-erase") + "請她忘掉</button></div></div>";

    li.querySelector(".mem-actions").outerHTML = '<div class="confirm"><p>她會忘掉這件事,不能復原。你們的羈絆不會因此改變。</p>' +

function openPanel() { $("#panel").hidden = false; $("#bondBtn").setAttribute("aria-expanded", "true"); $("#closePanel").focus(); }

/* ---- her line above the capsule: streamed in, stepped through only when it is long ---------- */
let state = "here", deltaKind = "plus", voiceOn = true, run = 0, reply = null, youTimer = 0, deltaTimer = 0;
const herLine = $("#herLine"), lineText = $("#lineText");
function youSaid(text, label) {
  clearTimeout(youTimer);
  const p = $("#you"); p.textContent = text ? (label || "你:") + text : "";
  p.classList.toggle("show", !!text);
}
function fadeYou() { clearTimeout(youTimer); youTimer = setTimeout(() => $("#you").classList.remove("show"), reduced ? 8000 : 4000); }
function speaking(on) { $("#speaking").hidden = !(on && voiceOn && STATES[state].voice); }
function setMore(more) {
  herLine.classList.toggle("more", more);
  if (more) { herLine.tabIndex = 0; herLine.setAttribute("role", "button"); herLine.title = "下一句(Enter)"; }
  else { herLine.removeAttribute("tabindex"); herLine.removeAttribute("role"); herLine.removeAttribute("title"); }
}
async function herReply(steps, delta, me, at) {
  setMore(false); speaking(false);
  lineText.innerHTML = '<span class="thinking"><span class="pulse" aria-hidden="true"></span>她在想</span>';
  await wait(reduced ? 300 : 1100); if (me !== run) return;
  reply = { steps, i: 0, delta, me, at: at || clock(), done: false };
  playStep();
}
async function playStep() {
  const r = reply, me = r.me, text = r.steps[r.i];
  r.streaming = true; r.skip = false; setMore(false);
  lineText.textContent = "";
  const caret = document.createElement("span"); caret.className = "caret"; caret.setAttribute("aria-hidden", "true");
  lineText.appendChild(caret); speaking(true);
  const chars = [...text];
  for (let i = 0; i < chars.length && !r.skip; i += 2) {
    caret.before(chars.slice(i, i + 2).join(""));
    await wait(55); if (me !== run || r !== reply) return;
  }
  lineText.textContent = text; r.streaming = false;
  setTimeout(() => { if (reply === r && !r.streaming) speaking(false); }, 1400);
  if (r.i < r.steps.length - 1) setMore(true); else finish(r);
}
function finish(r) {
  if (r.done) return; r.done = true;
  logEntry({ who: "her", t: r.steps.join(""), at: r.at });
  if (r.delta) { logEntry({ mark: r.delta }); moved(r.delta[0], r.delta[1]); }
  fadeYou();
}
function advance() {
  if (!reply) return;
  if (reply.streaming) { reply.skip = true; return; }
  if (reply.i < reply.steps.length - 1) { reply.i++; playStep(); }
}
function flush() { if (reply && !reply.done) { reply.skip = true; run++; finish(reply); } }
herLine.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); advance(); } });

  $("#deltaQuote").textContent = quote;
  b.classList.add(kind === "plus" ? "beat" : "dim");
  if (!reduced) deltaTimer = setTimeout(() => b.classList.add("faded"), 8000);
}

/* ---- her figure ------------------------------------------------------------------------------ */
const video = $("#her");

  const file = POSES[name];
  video.classList.add("swap");
  setTimeout(() => {
    video.poster = ART + file + ".webp";
    if (name === "still" || reduced) { video.pause(); video.removeAttribute("src"); video.load(); }
    else { video.src = ART + file + ".webm"; video.play().catch(() => {}); }
    video.classList.remove("swap");
  }, reduced ? 0 : 200);
}

/* ---- one state of the page: the status line and the capsule change, nothing is added ------- */
function apply() {
  const me = ++run; reply = null;
  const scene = SCENES[state === "here" ? deltaKind : state], s = STATES[state];
  document.body.dataset.state = state;
  $("#status").innerHTML = scene.status();
  $("#say").placeholder = s.placeholder; $("#say").value = "";
  $("#voice").hidden = !s.voice; $("#mic").hidden = !s.mic;
  $("#voice").setAttribute("aria-pressed", String(voiceOn));
  $("#send").setAttribute("aria-label", s.send); $("#send").title = s.send;
  stopListening(); speaking(false); setMore(false);
  const b = $("#bond"); clearTimeout(deltaTimer); delete b.dataset.delta; b.classList.remove("beat", "dim", "faded");
  pose(scene.pose);
  entries = scene.history.slice();
  if (!$("#backlog").hidden) { $("#backlog").hidden = true; openLog(); }
  if (scene.now) {
    entries.push({ who: "you", t: scene.now.you, at: scene.now.at });
    youSaid(scene.now.you);
    herReply(scene.now.her, scene.now.delta, me, scene.now.at);
  } else {
    youSaid(""); lineText.textContent = "";
  }
  measureDock();
}

/* ---- the capsule ----------------------------------------------------------------------------- */
$("#voice").onclick = () => {
  voiceOn = !voiceOn; $("#voice").setAttribute("aria-pressed", String(voiceOn));
  $("#voice").title = "她的聲音:" + (voiceOn ? "開" : "關"); if (!voiceOn) speaking(false);
};
let listening = false;
function stopListening() { listening = false; $("#capsule").classList.remove("listening"); $("#mic").setAttribute("aria-pressed", "false"); }
$("#mic").onclick = () => {
  if (!listening) { listening = true; $("#capsule").classList.add("listening"); $("#mic").setAttribute("aria-pressed", "true"); return; }
  stopListening(); $("#say").value = "週末我會準時帶到,不用擔心"; $("#say").focus();
};
$("#say").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || e.isComposing) return;
  e.preventDefault();
  if ($("#say").value.trim() === "") advance(); else $("#capsule").requestSubmit();
});
$("#capsule").onsubmit = (e) => {
  e.preventDefault();
  const files = attached.map((a) => a.name);
  const text = $("#say").value.trim() || (files.length ? "(附加了 " + files.length + " 個檔案)" : "");
  if (!text) return;
  $("#say").value = ""; setAttached([]);
  const shown = files.length ? text + " · " + files.join("、") : text;
  if (state === "asleep") {
    logEntry({ who: "you", t: text, at: "02:31", note: true, files });
    youSaid(shown, "留好了,她醒來會讀:"); fadeYou(); return;
  }
  flush();
  const me = ++run;
  logEntry({ who: "you", t: text, at: clock(), files }); youSaid(shown);
  const pool = files.length && state === "here" ? REPLIES.files : REPLIES[state];
  herReply(pool[Math.floor(Math.random() * pool.length)], null, me);
};

/* ---- attachments: "+" opens the file picker in the product; in the mock it attaches a sample
   picture and file. Dropping real files on the page attaches them, with a quiet hint while dragging. */
let attached = [];
const SAMPLE = [
  { name: "看這個.webp", size: 169010, src: "../../assets/hero.webp" },
  { name: "週末菜單.pdf", size: 186368 },
];
function size(n) { return n < 1024 * 1024 ? Math.max(1, Math.round(n / 1024)) + " KB" : (n / 1048576).toFixed(1) + " MB"; }
function setAttached(list) {
  attached = list;
  const box = $("#attach"); box.innerHTML = "";
  attached.forEach((a, i) => {
    const c = document.createElement("span"); c.className = "chip";
    c.innerHTML = (a.src ? '<img alt="">' : '<span class="fi">' + icon("i-file") + "</span>") +
      '<span class="nm"></span><span class="sz"></span>' +
      '<button type="button" class="ib x" title="拿掉">' + icon("i-x") + "</button>";
    if (a.src) c.querySelector("img").src = a.src;
    c.querySelector(".nm").textContent = a.name;
    c.querySelector(".sz").textContent = size(a.size);
    c.querySelector(".x").setAttribute("aria-label", "拿掉 " + a.name);
    c.querySelector(".x").onclick = () => { setAttached(attached.filter((_, j) => j !== i)); $("#say").focus(); };
    box.appendChild(c);
  });
  $("#withAttach").checked = attached.length > 0;
  measureDock();
}
$("#add").onclick = () => { setAttached(SAMPLE.slice()); $("#say").focus(); };
$("#withAttach").onchange = (e) => setAttached(e.target.checked ? SAMPLE.slice() : []);
function addFiles(list) {
  const more = [...list].slice(0, 4).map((f) => ({ name: f.name, size: f.size,
    src: f.type.startsWith("image/") ? URL.createObjectURL(f) : null }));
  setAttached([...attached, ...more].slice(0, 4));
}
let dragDepth = 0;
const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes("Files");
addEventListener("dragenter", (e) => { if (!hasFiles(e)) return; dragDepth++; $("#drop").hidden = false; });
addEventListener("dragleave", (e) => { if (!hasFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; $("#drop").hidden = true; } });
addEventListener("dragover", (e) => { if (hasFiles(e)) e.preventDefault(); });
addEventListener("drop", (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; $("#drop").hidden = true;
  addFiles(e.dataTransfer.files); $("#say").focus();
});

/* ---- opening and closing the backlog: button, PageUp, wheel up, swipe up; Esc, swipe down ----- */
$("#openLog").onclick = openLog;
$("#closeLog").onclick = closeLog;
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (!$("#backlog").hidden) closeLog(); else if (!$("#panel").hidden) closePanel(); else $("#mock").open = false; }
  if (e.key === "PageUp" && $("#backlog").hidden && !e.target.closest(".mock")) { e.preventDefault(); openLog(); }
});
let wheelUp = 0;
$("#room").addEventListener("wheel", (e) => {
  if (!$("#backlog").hidden || !$("#panel").hidden) return;
  wheelUp = e.deltaY < 0 ? wheelUp - e.deltaY : 0;
  if (wheelUp > 60) { wheelUp = 0; openLog(); }
}, { passive: true });

/* A swipe: pointer events, so a finger and a mouse drag both work. Up from the capsule (or her
   line, or the handle) opens; down on the backlog's head closes. What is dragged follows a little. */
let dragMoved = false;
function swipe(target, dir, onDone, follow, onTap) {
  let start = null;
  target.addEventListener("pointerdown", (e) => {
    if (e.button > 0 || e.target.closest("button, a")) return;
    start = { x: e.clientX, y: e.clientY, id: e.pointerId, on: e.target }; dragMoved = false;
    // Outside the text field: no text selection or native drag, and the pointer stays ours even
    // when a mouse leaves the element (a finger is held by the element it went down on anyway).
    if (!e.target.closest("textarea")) {
      e.preventDefault();
      try { target.setPointerCapture(e.pointerId); } catch { /* a pointer the page cannot capture */ }
    }
  });
  target.addEventListener("pointermove", (e) => {
    if (!start || e.pointerId !== start.id) return;
    const dy = e.clientY - start.y, dx = e.clientX - start.x;
    if (!dragMoved && Math.abs(dy) > 8 && Math.abs(dy) > Math.abs(dx)) dragMoved = true;
    if (dragMoved && follow) follow(dy);
  });
  const end = (e) => {
    if (!start || e.pointerId !== start.id) return;
    const dy = e.clientY - start.y, dx = e.clientX - start.x;
    if (follow) follow(0);
    if (e.type === "pointerup" && dragMoved && dy * dir > 56 && Math.abs(dy) > Math.abs(dx)) onDone();
    else if (e.type === "pointerup" && !dragMoved && onTap) onTap(start.on);
    start = null; setTimeout(() => { dragMoved = false; }, 0);
  };
  target.addEventListener("pointerup", end);
  target.addEventListener("pointercancel", end);
}
swipe($("#dock"), -1, openLog, (dy) => {
  const d = $("#dock"); d.classList.toggle("dragging", dy !== 0);
  d.style.translate = dy < 0 ? "0 " + Math.max(dy * 0.35, -40) + "px" : "";
}, (on) => { if (on.closest("#herLine")) advance(); });
swipe($("#blHead"), 1, closeLog, (dy) => {
  const b = $("#backlog"); b.classList.toggle("dragging", dy !== 0);
  b.style.transform = dy > 0 ? "translateY(" + dy * 0.6 + "px)" : "";
});

/* The dock's height, so the panel on a phone stays clear of it. */
function measureDock() { document.documentElement.style.setProperty("--dock-h", $("#dock").offsetHeight + "px"); }
addEventListener("resize", measureDock);

/* ---- mock controls ----------------------------------------------------------------------------- */
for (const r of document.querySelectorAll('input[name="state"]')) r.onchange = () => { state = r.value; apply(); };
for (const r of document.querySelectorAll('input[name="delta"]')) r.onchange = () => {
  deltaKind = r.value; state = "here"; document.querySelector('input[name="state"][value="here"]').checked = true; apply();
};
$("#replay").onclick = apply;
apply();
</script>
